      <h1>룽룽씨 메이커</h1>
      <span class="brand-sub">OOC → 폰 화면</span>
    </div>

    <div class="appbar-spacer"></div>

    <div class="seg" id="modeSeg" role="tablist" aria-label="출력 종류">
      <span class="seg-ind" id="segInd"></span>
      <button class="seg-btn is-on" role="tab" aria-selected="true" data-mode="chat">채팅</button>
      <button class="seg-btn" role="tab" aria-selected="false" data-mode="memo">메모</button>
    </div>

    <div class="appbar-spacer"></div>

    <div class="appbar-actions">
      <button class="icon-btn" id="btnUiTheme" title="화면 밝기 전환" aria-label="화면 밝기 전환" data-ico="moon"></button>
      <button class="icon-btn" id="btnHelp" title="도움말" aria-label="도움말" data-ico="help"></button>
    </div>
  </header>

  <main class="workspace">

    <!-- ============ PANEL ============ -->
    <aside class="panel">
      <nav class="tabs" role="tablist" aria-label="작업 단계">
        <button class="tab is-on" role="tab" data-tab="input">붙여넣기<span class="tab-line"></span></button>
        <button class="tab" role="tab" data-tab="edit">선택·편집<span class="tab-n" id="tabEditN">0</span><span class="tab-line"></span></button>
        <button class="tab" role="tab" data-tab="theme">테마<span class="tab-line"></span></button>
        <button class="tab" role="tab" data-tab="export">내보내기<span class="tab-line"></span></button>
      </nav>

      <div class="panes" id="panes">

        <!-- ---------- PANE: INPUT ---------- -->
        <div class="pane is-on" data-pane="input">
          <div class="sec">
            <div class="sec-h">
              <span class="sec-t">원본 붙여넣기</span>
              <div class="sec-x">
                <button class="btn sm ghost" id="btnSample" data-ico-pre="sparkle">예시</button>
                <button class="btn sm ghost" id="btnPaste" data-ico-pre="clipboard">붙여넣기</button>
              </div>
            </div>
            <textarea class="ta mono" id="raw" rows="11" spellcheck="false"
              placeholder="AI가 출력한 내용을 통째로 붙여넣으세요.&#10;OOC 지시문·하단 메타정보·details 블록은 자동으로 걸러집니다."></textarea>
            <div class="btn-row" style="margin-top:8px">
              <button class="btn sm ghost danger" id="btnClearRaw" data-ico-pre="trash">비우기</button>
              <span style="flex:1"></span>
              <button class="btn sm ink-btn" id="btnParse" data-ico-pre="wand">다시 분석</button>
            </div>
            <div id="parseStat" style="margin-top:10px"></div>
          </div>

          <hr class="hr">

          <!-- chat-only -->
          <div class="sec" data-only="chat">
            <div class="sec-h"><span class="sec-t">대화방</span></div>
            <div class="field" id="roomModeField">
              <span class="lab">인물이 3명 이상일 때</span>
              <div class="choice" data-choice="roomMode">
                <button class="choice-b is-on" data-v="one">한 방만</button>
                <button class="choice-b" data-v="split">방마다 한 장</button>
                <button class="choice-b" data-v="group">단톡으로 합치기</button>
              </div>
              <p class="hint" id="roomModeHint"></p>
            </div>
            <div class="chips" id="roomChips"></div>
            <div class="field" style="margin-top:12px">
              <label class="lab" for="roomName">채팅방 이름</label>
              <input class="inp" id="roomName" placeholder="자동 (상대 이름)">
            </div>
            <div class="field">
              <label class="lab" for="meSel">나 <span class="val">오른쪽에 표시</span></label>
              <select class="sel" id="meSel"></select>
              <p class="hint">여기서 고른 인물의 말풍선이 오른쪽(내 메시지)으로 표시됩니다.</p>
            </div>
            <div class="field">
              <span class="lab">날짜 구분선</span>
              <input class="inp" id="chatDate" placeholder="예: 2026년 9월 18일 금요일 (비우면 숨김)">
            </div>
          </div>

          <!-- memo-only -->
          <div class="sec" data-only="memo">
            <div class="sec-h"><span class="sec-t">메모 앱</span></div>
            <div class="field">
              <label class="lab" for="memoTitle">앱 제목</label>
              <input class="inp" id="memoTitle" placeholder="메모">
            </div>
            <div class="field">
              <span class="lab">홈 화면 스타일</span>
              <div class="choice" id="memoStyle" data-choice="memoStyle">
                <button class="choice-b is-on" data-v="list">리스트 (iOS)</button>
                <button class="choice-b" data-v="card">카드 (갤럭시)</button>
                <button class="choice-b" data-v="grid">2단 그리드</button>
              </div>
            </div>
            <div class="field">
              <span class="lab">날짜 그룹</span>
              <div class="choice" id="memoGroup" data-choice="memoGroup">
                <button class="choice-b is-on" data-v="month">월별</button>
                <button class="choice-b" data-v="auto">오늘·이번 주</button>
                <button class="choice-b" data-v="none">없음</button>
              </div>
            </div>
            <div class="field">
              <span class="lab">정렬</span>
              <div class="choice" id="memoSort" data-choice="memoSort">
                <button class="choice-b is-on" data-v="raw">붙여넣은 순</button>
                <button class="choice-b" data-v="desc">최신순</button>
                <button class="choice-b" data-v="asc">오래된순</button>
              </div>
            </div>
          </div>
        </div>

        <!-- ---------- PANE: EDIT ---------- -->
        <div class="pane" data-pane="edit">
          <div class="sec">
            <div class="sec-h"><span class="sec-t">출력 범위</span>
              <div class="sec-x"><button class="btn sm ghost" id="btnRangeAll">전체 범위</button></div>
            </div>
            <div class="sld dual" id="rangeSld" tabindex="0" role="group" aria-label="출력 범위"></div>
            <div style="display:flex;gap:8px;align-items:center;margin-top:2px">
              <input class="inp" id="rangeA" inputmode="numeric" style="width:78px;text-align:center" aria-label="시작">
              <span style="color:var(--text-3);font-size:13px">–</span>
              <input class="inp" id="rangeB" inputmode="numeric" style="width:78px;text-align:center" aria-label="끝">
              <span class="hint" style="margin:0 0 0 auto" id="rangeInfo"></span>
            </div>
          </div>

          <hr class="hr">

          <div class="sec">
            <div class="el-tools">
              <button class="btn sm" id="btnSelAll">전체 선택</button>
              <button class="btn sm" id="btnSelNone">해제</button>
              <button class="btn sm" id="btnSelInv">반전</button>
              <span class="el-count" id="elCount"></span>
            </div>
            <div class="el" id="editList"></div>
          </div>
        </div>

        <!-- ---------- PANE: THEME ---------- -->
        <div class="pane" data-pane="theme">
          <div class="sec">
            <div class="sec-h">
              <button class="sec-fold" id="btnThFold" aria-expanded="true" title="테마 목록 접기">
                <span class="chev" data-ico="chev"></span><span class="sec-t">테마</span>
              </button>
              <div class="sec-x">
                <button class="btn sm ghost" id="btnThImport" data-ico-pre="upload">불러오기</button>
                <button class="btn sm ghost" id="btnThExport" data-ico-pre="download">내보내기</button>
              </div>
            </div>
            <div id="thFolded" class="th-folded" hidden></div>
            <div id="thBody">
              <div class="chips" id="thFilter" style="margin-bottom:11px"></div>
              <div class="th-grid" id="thGrid"></div>
              <div class="btn-row fill" style="margin-top:11px">
                <button class="btn sm" id="btnThSave" data-ico-pre="save">현재 설정을 테마로 저장</button>
              </div>
            </div>
            <input type="file" id="thFile" accept=".json,.rrtheme,application/json" hidden>
          </div>

          <hr class="hr">

          <div class="sec">
            <div class="sec-h"><span class="sec-t">직접 꾸미기</span>
              <div class="sec-x">
                <button class="btn sm ghost" id="btnFoldAll">모두 접기</button>
                <button class="btn sm ghost" id="btnThReset">되돌리기</button>
              </div>
            </div>
            <div id="thEditor"></div>
          </div>
        </div>

        <!-- ---------- PANE: EXPORT ---------- -->
        <div class="pane" data-pane="export">
          <div class="sec">
            <div class="sec-h"><span class="sec-t">장수</span></div>
            <div class="field">
              <span class="lab">나눌 장수 <span class="val" id="pagesVal">1장</span></span>
              <div class="sld" id="pagesSld" tabindex="0" role="slider" aria-label="나눌 장수"></div>
              <p class="hint" id="pagesHint"></p>
            </div>
            <div class="field" data-only="memo">
              <span class="lab">내보낼 화면</span>
              <div class="choice" data-choice="memoExport">
                <button class="choice-b is-on" data-v="home">홈 화면</button>
                <button class="choice-b" data-v="detail">선택한 메모</button>
                <button class="choice-b" data-v="both">홈 + 메모</button>
              </div>
              <p class="hint">‘선택한 메모’는 미리보기 홈에서 카드를 눌러 고릅니다. <span id="memoSelInfo"></span></p>
            </div>
          </div>

          <hr class="hr">

          <div class="sec">
            <div class="sec-h"><span class="sec-t">파일</span></div>
            <div class="field">
              <label class="lab" for="fileName">파일 이름</label>
              <input class="inp" id="fileName" placeholder="비우면 자동으로 지정됩니다">
              <p class="hint" id="fileHint"></p>
            </div>
            <div class="field">
              <span class="lab">해상도</span>
              <div class="choice" data-choice="scale">
                <button class="choice-b" data-v="1">1× 표준</button>
                <button class="choice-b is-on" data-v="2">2× 선명</button>
                <button class="choice-b" data-v="3">3× 최고</button>
              </div>
              <p class="hint" id="sizeHint"></p>
            </div>
            <button class="btn lg ink-btn block" id="btnExport" data-ico-pre="download" style="margin-top:14px">PNG로 저장</button>
          </div>

          <hr class="hr">

          <div class="sec">
            <div class="sec-h"><span class="sec-t">작업 데이터</span></div>
            <div class="stat" id="saveStat"></div>
            <div class="btn-row fill" style="margin-top:9px">
              <button class="btn sm" id="btnDataExport" data-ico-pre="download">작업 내보내기</button>
              <button class="btn sm" id="btnDataImport" data-ico-pre="upload">작업 불러오기</button>
            </div>
            <div class="btn-row" style="margin-top:7px">
              <button class="btn sm ghost danger block" id="btnResetAll" data-ico-pre="trash">모두 초기화</button>
            </div>
            <input type="file" id="dataFile" accept=".json,application/json" hidden>
          </div>
        </div>

      </div>
    </aside>

    <!-- ============ STAGE ============ -->
    <section class="stage">
      <div class="stage-bar">
        <span class="stage-label">미리보기</span>
        <span class="stage-meta" id="stageMeta"></span>
        <div class="stage-tools">
          <button class="icon-btn" id="btnStatusBar" title="상태바 표시" aria-label="상태바 표시" data-ico="signal"></button>
          <button class="icon-btn" id="btnFlip" title="플립 모드" aria-label="플립 모드" data-ico="layers"></button>
        </div>
      </div>
      <div class="rsz rsz-x" id="rszX" title="패널 너비 조절" aria-label="패널 너비 조절"><i></i></div>
      <div class="rsz rsz-y" id="rszY" title="미리보기 높이 조절" aria-label="미리보기 높이 조절"><i></i></div>
      <div class="stage-area" id="stageArea">
        <div class="fit-outer" id="fitOuter"><div class="fit-inner" id="fitInner">

        </div></div>
      </div>
      <div class="stage-foot" id="stageFoot"></div>
    </section>

  </main>
