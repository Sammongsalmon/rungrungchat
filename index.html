function memoGroupLabel(n,i,arr){
  if(S.memo.group==='none') return null;
  if(S.memo.group==='month') return n.mo? n.mo+'월' : '기타';
  /* auto: newest = 오늘 */
  const top=arr.reduce((a,b)=>b.ord>a?b.ord:a,0);
  const d=Math.abs(top-n.ord)/1000;
  return d<1?'오늘':d<7?'이번 주':d<31?'이번 달':'이전';
}
function paperCss(t){
  if(t.paper==='ruled') return 'repeating-linear-gradient(to bottom, transparent 0 24px, '+rgba(t.subCol,0.18)+' 24px 25px)';
  if(t.paper==='grid')  return 'repeating-linear-gradient(to bottom, transparent 0 23px, '+rgba(t.subCol,0.13)+' 23px 24px),'+
                               'repeating-linear-gradient(to right, transparent 0 23px, '+rgba(t.subCol,0.13)+' 23px 24px)';
  if(t.paper==='dot')   return 'radial-gradient('+rgba(t.subCol,0.28)+' 1px, transparent 1px)';
  return '';
}
function memoBodyNode(note,t,limit){
  const wrap=el('div','md-body rt');
  wrap.style.color=t.bodyCol; wrap.style.fontSize=t.fontSize+'px';
  const bl=memoBlocks(note.body);
  const use = limit? bl.slice(0,limit) : bl;
  use.forEach(function(b){
    if(b.k==='gap'){ const g=el('div'); g.style.height='0.62em'; wrap.appendChild(g); return; }
    if(b.k==='li'||b.k==='cb'){
      const li=el('div','md-li');
      if(b.k==='cb'){
        const cb=el('div','md-cb');
        cb.style.background=b.done?t.accent:'transparent';
        cb.style.boxShadow='inset 0 0 0 1.6px '+(b.done?t.accent:rgba(t.subCol,0.6));
        if(b.done) cb.appendChild(lineIco('check',10,readable(t.accent),3));
        li.appendChild(cb);
      }else{
        const bu=el('div','li-b',b.b); bu.style.color=t.accent; li.appendChild(bu);
      }
      const c=el('div','li-c rt'); c.innerHTML=richHTML(b.c); li.appendChild(c);

      return;
    }
    const p=el('div','rt'); p.innerHTML=richHTML(b.c); wrap.appendChild(p);

  return wrap;
}

/* ============================================================
   CONTROLS
   — slider keeps the thumb exactly where the finger let go
   — text inputs are never rewritten while focused
   ============================================================ */

function makeSlider(node,opt){
  opt=opt||{};
  const dual=!!opt.dual;
  const min=opt.min==null?0:opt.min, max=opt.max==null?100:opt.max;
  const step=opt.step||1;
  const fmt=opt.fmt||(v=>String(v));
  let va = dual ? clamp(opt.value[0],min,max) : clamp(opt.value,min,max);
  let vb = dual ? clamp(opt.value[1],min,max) : 0;
  let dragging=null, api;

  node.innerHTML='';
  node.classList.add('sld'); if(dual) node.classList.add('dual');
  const track=el('div','sld-track'); const fill=el('div','sld-fill');
  track.appendChild(fill); node.appendChild(track);
  if(opt.ticks && (max-min)/step<=26){
    const tk=el('div','sld-ticks');
    for(let i=min;i<=max;i+=step) tk.appendChild(el('i'));
    node.appendChild(tk);
  }
  const thA=el('div','sld-thumb a'); node.appendChild(thA);
  const thB=dual?el('div','sld-thumb b'):null; if(thB) node.appendChild(thB);
  const bub=el('div','sld-bub'); node.appendChild(bub);
  node.setAttribute('tabindex','0');

  function pct(v){ return (max===min)?0:((v-min)/(max-min))*100; }
  function paint(){
    const pa=pct(va), pb=dual?pct(vb):pa;
    thA.style.left='calc(10px + (100% - 20px) * '+(pa/100)+')';
    if(thB) thB.style.left='calc(10px + (100% - 20px) * '+(pb/100)+')';
    if(dual){ const lo=Math.min(pa,pb), hi=Math.max(pa,pb);
      fill.style.left=lo+'%'; fill.style.right=(100-hi)+'%'; }
    else { fill.style.left='0'; fill.style.right=(100-pa)+'%'; }
    const act=(dragging==='b')?pb:pa;
    bub.style.left='calc(10px + (100% - 20px) * '+(act/100)+')';
    bub.textContent=fmt(dragging==='b'?vb:va, dual?[va,vb]:va);
    node.setAttribute('aria-valuenow', dual? (Math.min(va,vb)+'-'+Math.max(va,vb)) : va);
  }
  function fromX(cx){
    const r=track.getBoundingClientRect();
    const p=clamp((cx-r.left)/Math.max(1,r.width),0,1);
    let v=min+p*(max-min);
    v=Math.round(v/step)*step;
    v=clamp(v,min,max);
    return +v.toFixed(6);
  }
  function down(e){
    if(e.button!=null && e.button!==0) return;
    node.setPointerCapture&&node.setPointerCapture(e.pointerId);
    node.classList.add('is-drag');
    const v=fromX(e.clientX);
    if(dual) dragging = Math.abs(v-va)<=Math.abs(v-vb) ? 'a' : 'b';
    else dragging='a';
    if(dragging==='a') va=v; else vb=v;
    paint(); opt.onInput&&opt.onInput(api.value());
    e.preventDefault();
  }
  function move(e){
    if(!dragging) return;
    const v=fromX(e.clientX);
    if(dragging==='a'){ if(v===va) return; va=v; } else { if(v===vb) return; vb=v; }
    paint(); opt.onInput&&opt.onInput(api.value());
    e.preventDefault();
  }
  function up(e){
    if(!dragging) return;
    dragging=null; node.classList.remove('is-drag');
    try{ node.releasePointerCapture&&node.releasePointerCapture(e.pointerId); }catch(_){}
    paint(); opt.onChange&&opt.onChange(api.value());
  }
  on(node,'pointerdown',down);
  on(node,'pointermove',move);
  on(node,'pointerup',up);
  on(node,'pointercancel',up);
  on(node,'lostpointercapture',up);
  on(node,'keydown',function(e){
    const k=e.key; let d=0;
    if(k==='ArrowRight'||k==='ArrowUp') d=step;
    else if(k==='ArrowLeft'||k==='ArrowDown') d=-step;
    else if(k==='Home') d=min-va; else if(k==='End') d=max-va;
    else return;
    e.preventDefault();
    va=clamp(va+d,min,max); paint();
    opt.onInput&&opt.onInput(api.value()); opt.onChange&&opt.onChange(api.value());
  });

  api={
    value(){ return dual?[Math.min(va,vb),Math.max(va,vb)]:va; },
    set(v,silent){
      if(dragging) return;                       /* never fight the finger */
      if(dual){ va=clamp(v[0],min,max); vb=clamp(v[1],min,max); }
      else va=clamp(v,min,max);
      paint(); if(!silent&&opt.onChange) opt.onChange(api.value());
    },
    bounds(nmin,nmax){
      if(dragging) return;
      opt.min=nmin; opt.max=nmax;
      api._min=nmin;
      return;
    },
    dragging(){ return !!dragging; },
    paint:paint
  };
  paint();
  return api;
}

/* rebuild a slider in place when its range changes */
const SLD={};
function slider(sel,opt){
  const node=$(sel); if(!node) return null;
  SLD[sel]=makeSlider(node,opt);
  return SLD[sel];
}

/* ------------------------------------------------------------
   safe text / number input
   ------------------------------------------------------------ */
function bindText(node,get,set,opt){
  if(!node) return;
  opt=opt||{};
  node._get=get;
  const push=()=>{ if(document.activeElement!==node) node.value=get()==null?'':get(); };
  node._sync=push; push();
  const commit=(v,live)=>{ set(v,live); };
  const soft=debounce(function(){ if(document.activeElement===node) commit(node.value,true); }, opt.live===false?100000:520);
  on(node,'input',soft);
  on(node,'change',function(){ commit(node.value,false); });
  on(node,'blur',function(){ commit(node.value,false); raf(()=>push()); });
  on(node,'keydown',function(e){ if(e.key==='Enter'&&node.tagName!=='TEXTAREA'){ e.preventDefault(); node.blur(); } });
}
function bindNum(node,get,set,lo,hi){
  if(!node) return;
  const push=()=>{ if(document.activeElement!==node) node.value=get(); };
  node._sync=push; push();
  on(node,'blur',function(){
    let v=parseInt(String(node.value).replace(/[^\d-]/g,''),10);
    if(isNaN(v)) v=get();
    v=clamp(v,lo(),hi());
    set(v); raf(()=>push());
  });
  on(node,'keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); node.blur(); } });
}
function syncInputs(root){ $$('input,textarea',root||document).forEach(n=>{ if(n._sync) n._sync(); }); }
function raf(fn){ return requestAnimationFrame(fn); }

/* ------------------------------------------------------------
   choice groups / switches / colour rows
   ------------------------------------------------------------ */
function bindChoice(name,get,set){
  const box=$('[data-choice="'+name+'"]'); if(!box) return;
  box._sync=function(){
    $$('.choice-b',box).forEach(b=>b.classList.toggle('is-on', String(b.dataset.v)===String(get())));
  };
  $$('.choice-b',box).forEach(function(b){
    on(b,'click',function(){ set(b.dataset.v); box._sync(); });
  });
  box._sync();
}
function switchRow(title,desc,get,set){
  const r=el('label','sw-row');
  const t=el('div','sw-txt');
  t.appendChild(el('div','sw-t',title));
  if(desc) t.appendChild(el('div','sw-d',desc));
  r.appendChild(t);
  const s=el('div','sw'); s.appendChild(el('i')); r.appendChild(s);
  const paint=()=>s.classList.toggle('is-on',!!get());
  paint();
  on(r,'click',function(e){ e.preventDefault(); set(!get()); paint(); });
  r._sync=paint;
  return r;
}
function colorRow(label,get,set,warnAgainst){
  const r=el('div','col-row');
  const sw=el('label','col-sw');
  const fillN=el('i'); sw.appendChild(fillN);
  const inp=document.createElement('input'); inp.type='color'; sw.appendChild(inp);
  r.appendChild(sw);
  const lb=el('div','col-lab',label); r.appendChild(lb);
  const hexI=document.createElement('input'); hexI.className='col-hex'; hexI.spellcheck=false; r.appendChild(hexI);

  const paint=function(){
    const v=hx(get())||'#000000';
    fillN.style.background=v; inp.value=v;
    if(document.activeElement!==hexI) hexI.value=v;
    if(warnAgainst){
      const bg=warnAgainst(); const c=contrast(v,bg);
      lb.style.color = c<3 ? 'var(--danger)' : '';
      lb.title = c<3 ? ('대비 '+c.toFixed(1)+':1 — 읽기 어려울 수 있습니다') : '';
    }
  };
  on(inp,'input',function(){ set(hx(inp.value)); paint(); });
  on(hexI,'change',function(){ const v=hx(hexI.value); if(v){ set(v); } paint(); });
  on(hexI,'blur',paint);
  paint(); r._sync=paint;
  return r;
}

function pickImage(maxPx,cb){
  const f=document.createElement('input'); f.type='file'; f.accept='image/*';
  f.onchange=function(){
    const file=f.files&&f.files[0]; if(!file) return;
    const rd=new FileReader();
    rd.onload=function(){ shrink(rd.result,maxPx,cb); };
    rd.readAsDataURL(file);
  };
  f.click();
}
function shrink(dataUrl,maxPx,cb){
  const im=new Image();
  im.onload=function(){
    let w=im.naturalWidth,h=im.naturalHeight;
    const r=Math.min(1,maxPx/Math.max(w,h));
    w=Math.round(w*r); h=Math.round(h*r);
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(im,0,0,w,h);
    let out;
    try{ out=c.toDataURL('image/webp',0.86); if(out.indexOf('image/webp')<0) throw 0; }
    catch(e){ out=c.toDataURL('image/jpeg',0.88); }
    cb(out);
  };
  im.onerror=function(){ toast('이미지를 읽지 못했습니다','warn'); };
  im.src=dataUrl;
}
function downloadBlob(blob,name){
  const u=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
function downloadText(txt,name,mime){
  downloadBlob(new Blob([txt],{type:mime||'application/json'}),name);
}

/* ============================================================
   PAGINATION
   ============================================================ */
const HDR_PENALTY=22;   /* a group header re-drawn when a page starts mid-group */

/* measure every unit inside a hidden full-length render */
function measureUnits(build,ids){
  const host=el('div');
  host.style.cssText='position:fixed;left:-10000px;top:0;width:'+PV_W+'px;pointer-events:none;opacity:0;z-index:-1';
  const page=build();
  host.appendChild(page);
  document.body.appendChild(host);

  const body=$('.pv-body',page);
  const bRect=body.getBoundingClientRect();
  const tops=[];
  ids.forEach(function(id){
    const n=body.querySelector('[data-u="'+cssEsc(id)+'"]');
    tops.push(n ? (n.getBoundingClientRect().top-bRect.top) : (tops.length?tops[tops.length-1]:0));
  });
  if(tops.length) tops[0]=0;      /* page 1 owns the header area above the first unit */
  const total=body.scrollHeight;
  const chrome=page.getBoundingClientRect().height-bRect.height;
  host.remove();
  return {tops:tops, total:total, chrome:chrome};
}
function cssEsc(s){ return String(s).replace(/["\\]/g,'\\$&'); }

/* split indices into exactly n contiguous chunks, balanced by height */
function splitBalanced(tops,total,n){
  const N=tops.length;
  if(n<=1||N<=1) return [[0,N]];
  n=Math.min(n,N);
  const ext=tops.concat([total]);
  const span=(a,b)=>ext[b]-ext[a];
  let lo=0; for(let i=0;i<N;i++) lo=Math.max(lo,span(i,i+1));
  let hi=total, best=null;
  for(let it=0;it<40 && lo<=hi;it++){
    const mid=(lo+hi)/2;
    const cuts=pack(ext,N,mid);
    if(cuts.length<=n){ best=cuts; hi=mid-0.5; } else { lo=mid+0.5; }
  }
  let cuts=best||pack(ext,N,total/n);
  /* force exactly n chunks by bisecting the tallest ones */
  let guard=0;
  while(cuts.length<n && guard++<N){
    let bi=-1,bh=-1;
    for(let i=0;i<cuts.length;i++){
      const c=cuts[i]; if(c[1]-c[0]<2) continue;
      const h=span(c[0],c[1]); if(h>bh){bh=h;bi=i;}
    }
    if(bi<0) break;
    const c=cuts[bi], target=ext[c[0]]+span(c[0],c[1])/2;
    let k=c[0]+1;
    for(let j=c[0]+1;j<c[1];j++) if(Math.abs(ext[j]-target)<Math.abs(ext[k]-target)) k=j;
    cuts.splice(bi,1,[c[0],k],[k,c[1]]);
  }
  return cuts;
}
function pack(ext,N,maxH){
  const out=[]; let start=0;
  for(let i=1;i<=N;i++){
    if(ext[i]-ext[start]>maxH && i-1>start){ out.push([start,i-1]); start=i-1; }
  }
  out.push([start,N]);
  return out;
}

   PNG EXPORT  —  DOM -> inline styles -> SVG foreignObject -> canvas
   ============================================================ */
const PROPS=('display,position,top,right,bottom,left,width,height,min-width,min-height,max-width,max-height,'+
'margin-top,margin-right,margin-bottom,margin-left,padding-top,padding-right,padding-bottom,padding-left,'+
'box-sizing,border-top-width,border-right-width,border-bottom-width,border-left-width,'+
'border-top-style,border-right-style,border-bottom-style,border-left-style,'+
'border-top-color,border-right-color,border-bottom-color,border-left-color,'+
'border-top-left-radius,border-top-right-radius,border-bottom-right-radius,border-bottom-left-radius,'+
'background-color,background-image,background-size,background-position,background-repeat,background-clip,background-origin,'+
'color,font-family,font-size,font-weight,font-style,font-variant-numeric,line-height,letter-spacing,word-spacing,'+
'text-align,text-decoration-line,text-decoration-color,text-decoration-style,text-decoration-thickness,'+
'text-underline-offset,text-transform,text-overflow,text-indent,white-space,word-break,overflow-wrap,'+
'vertical-align,opacity,visibility,overflow-x,overflow-y,z-index,float,clear,'+
'flex-direction,flex-wrap,flex-grow,flex-shrink,flex-basis,align-items,align-self,align-content,justify-content,'+
'gap,row-gap,column-gap,grid-template-columns,grid-template-rows,place-items,'+
'transform,transform-origin,box-shadow,text-shadow,filter,object-fit,list-style-type,'+
'-webkit-text-fill-color,-webkit-text-stroke-color,-webkit-text-stroke-width').split(',');

const PDEF={'background-image':'none','box-shadow':'none','text-shadow':'none','transform':'none','filter':'none',
'margin-top':'0px','margin-right':'0px','margin-bottom':'0px','margin-left':'0px',
'padding-top':'0px','padding-right':'0px','padding-bottom':'0px','padding-left':'0px',
'border-top-width':'0px','border-right-width':'0px','border-bottom-width':'0px','border-left-width':'0px',
'border-top-style':'none','border-right-style':'none','border-bottom-style':'none','border-left-style':'none',
'border-top-left-radius':'0px','border-top-right-radius':'0px','border-bottom-right-radius':'0px','border-bottom-left-radius':'0px',
'letter-spacing':'normal','word-spacing':'normal','white-space':'normal','text-indent':'0px',
'text-decoration-line':'none','text-transform':'none','opacity':'1','z-index':'auto','position':'static',
'overflow-x':'visible','overflow-y':'visible','float':'none','clear':'none','visibility':'visible',
'min-width':'0px','min-height':'0px','max-width':'none','max-height':'none','text-overflow':'clip',
'word-break':'normal','overflow-wrap':'normal','vertical-align':'baseline','object-fit':'fill',
'flex-direction':'row','flex-wrap':'nowrap','flex-grow':'0','flex-shrink':'1','flex-basis':'auto',
'align-items':'normal','align-self':'auto','align-content':'normal','justify-content':'normal',
'gap':'normal','row-gap':'normal','column-gap':'normal','grid-template-columns':'none','grid-template-rows':'none',
'place-items':'normal','list-style-type':'disc','font-variant-numeric':'normal',
'background-size':'auto','background-position':'0% 0%','background-repeat':'repeat',
'background-clip':'border-box','background-origin':'padding-box','text-decoration-style':'solid',
'text-decoration-thickness':'auto','text-underline-offset':'auto','font-style':'normal',
'-webkit-text-stroke-width':'0px','right':'auto','bottom':'auto','top':'auto','left':'auto'};

function inlineTree(src,dst){
  const a=[src].concat($$('*',src));
  const b=[dst].concat($$('*',dst));
  for(let i=0;i<a.length;i++){
    const s=a[i], d=b[i];
    if(!d) break;
    if(s.ownerSVGElement) continue;                /* inside <svg>: attributes already carry paint */
    const cs=getComputedStyle(s);
    let css='';
    for(let j=0;j<PROPS.length;j++){
      const p=PROPS[j];
      const v=cs.getPropertyValue(p);
      if(v==='' ) continue;
      if(PDEF[p]!=null && v===PDEF[p]) continue;
      css+=p+':'+v+';';
    }
    d.setAttribute('style',css);
    d.removeAttribute('class');
    Array.prototype.slice.call(d.attributes).forEach(function(at){
      if(/^data-/.test(at.name)) d.removeAttribute(at.name);
    });
  }
}

function nodeToSvg(node){
  const r=node.getBoundingClientRect();
  const w=Math.max(1,Math.round(r.width)), h=Math.max(1,Math.round(r.height));
  const clone=node.cloneNode(true);
  inlineTree(node,clone);
  clone.style.margin='0'; clone.style.transform='none'; clone.style.boxShadow='none';
  clone.style.position='relative'; clone.style.left='0'; clone.style.top='0';
  clone.style.width=w+'px'; clone.style.minHeight=h+'px'; clone.style.height=h+'px';
  const xml=new XMLSerializer().serializeToString(clone);
  return {w:w,h:h,xml:xml};
}

function nodeToCanvas(node,scale){
  return new Promise(function(res,rej){
    const d=nodeToSvg(node);
    const sw=Math.round(d.w*scale), sh=Math.round(d.h*scale);
    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+sw+'" height="'+sh+'" '+
      'viewBox="0 0 '+d.w+' '+d.h+'"><foreignObject x="0" y="0" width="'+d.w+'" height="'+d.h+'">'+
      d.xml+'</foreignObject></svg>';
    const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    const im=new Image();
    im.decoding='sync';
    im.onload=function(){
      try{
        const c=document.createElement('canvas'); c.width=sw; c.height=sh;
        const x=c.getContext('2d');
        x.fillStyle='#FFFFFF'; x.fillRect(0,0,sw,sh);
        x.drawImage(im,0,0,sw,sh);
        res(c);
      }catch(e){ rej(e); }
    };
    im.onerror=function(){ rej(new Error('svg-render-failed')); };
    im.src=url;
  });
}
function canvasToBlob(c){
  return new Promise(function(res,rej){
    if(c.toBlob) c.toBlob(function(b){ b?res(b):rej(new Error('blob')); },'image/png');
    else{
      try{
        const s=c.toDataURL('image/png').split(',')[1];
        const bin=atob(s), arr=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
        res(new Blob([arr],{type:'image/png'}));
      }catch(e){ rej(e); }
    }
  });
}

let EXPORTING=false;
const GAP=26;

function pageWrap(node,label,tag){
  const p=el('div','page');
  p.style.width=PV_W+'px';
  p.dataset.label=label||'';
  p.appendChild(node);
  if(tag){ const t=el('div','page-tag',tag); p.appendChild(t); }

/* every exported page must come out the same height: measure, then pad them all up */
function equalizePages(deck){
  const pvs=$$('.page > .pv',deck);
  if(pvs.length<2) return;
  let mx=0;
  pvs.forEach(function(p){ p.style.minHeight=''; });
  pvs.forEach(function(p){ mx=Math.max(mx,p.offsetHeight); });
  pvs.forEach(function(p){ p.style.minHeight=mx+'px'; });
}

function buildDeck(){
  const deck=$('#deck');
  deck.innerHTML='';
  const items=liveList();

  if(!items.length){ deck.appendChild(emptyState()); return 0; }

  if(S.mode==='chat'){
    const n=clamp(S.pages.chat,1,items.length);
    if(n<=1){
      deck.appendChild(pageWrap(renderChatPage(items,{dateLine:true}),'',''));
    }else{
      const ids=items.map(u=>u.id);
      const m=measureUnits(()=>renderChatPage(items,{dateLine:true}),ids);
      const cuts=splitBalanced(m.tops,m.total,n);
      const ext=m.tops.concat([m.total]);
      cuts.forEach(function(c,i){
        deck.appendChild(pageWrap(
          renderChatPage(items.slice(c[0],c[1]),{dateLine:i===0}),'',
          (i+1)+' / '+cuts.length));
      });
      equalizePages(deck);
    }
    return $$('.page',deck).length;
  }

  /* ---------------- memo ---------------- */
  if(S.memo.open>=0){
    const note=items[S.memo.open]||items[0];
    if(note) addMemoDetailPages(deck,note,clamp(S.pages.memo,1,40));
    return $$('.page',deck).length;
  }
  const what=S.memo.exportWhat;
  const picked=items.filter(n=>S.memo.sel.indexOf(n.id)>=0);

  if(what==='home'||what==='both'||!picked.length){
    const n=(what==='both')?1:clamp(S.pages.memo,1,items.length);
    if(n<=1){
      deck.appendChild(pageWrap(renderMemoHome(items,{}),'홈',''));
    }else{
      const ids=items.map(x=>x.id);
      const m=measureUnits(()=>renderMemoHome(items,{}),ids);
      const cuts=splitBalanced(m.tops,m.total,n);
      const ext=m.tops.concat([m.total]);
      cuts.forEach(function(c,i){
        deck.appendChild(pageWrap(renderMemoHome(items.slice(c[0],c[1]),{}),'홈',(i+1)+' / '+cuts.length));
      });
      equalizePages(deck);
    }
  }
  if((what==='detail'||what==='both') && picked.length){
    if(picked.length===1 && what==='detail'){
      addMemoDetailPages(deck,picked[0],clamp(S.pages.memo,1,40));
    }else{
      picked.forEach(function(n){ deck.appendChild(pageWrap(renderMemoDetail(n,null,{}),plain(n.title).slice(0,18),plain(n.title).slice(0,14))); });
      equalizePages(deck);
    }
  }
  return $$('.page',deck).length;
}

function addMemoDetailPages(deck,note,n){
  const bl=memoBlocks(note.body);
  const label=plain(note.title).slice(0,18);
  if(n<=1||bl.length<=1){
    deck.appendChild(pageWrap(renderMemoDetail(note,null,{}),label,''));
    return;
  }
  /* split body text by line count, balanced */
  const lines=String(note.body).split('\n');
  const per=Math.ceil(lines.length/n);
  const chunks=[];
  for(let i=0;i<lines.length;i+=per) chunks.push(lines.slice(i,i+per).join('\n'));
  while(chunks.length<n && chunks.length) chunks.push('');
  chunks.slice(0,n).forEach(function(c,i){
    deck.appendChild(pageWrap(renderMemoDetail(note,c,{head:i===0}),label,(i+1)+' / '+Math.min(n,chunks.length)));
  });
  equalizePages(deck);
}

/* ---------- scale the deck to fit ---------- */
function innerBox(n){
  const cs=getComputedStyle(n);
  return {
    w: n.clientWidth - parseFloat(cs.paddingLeft||0) - parseFloat(cs.paddingRight||0),
    h: n.clientHeight - parseFloat(cs.paddingTop||0) - parseFloat(cs.paddingBottom||0)
  };
}
function layoutDeck(animate){
  const area=$('#stageArea'), fo=$('#fitOuter'), fi=$('#fitInner'), deck=$('#deck');
  const pages=$$('.page',deck);
  const isFlip=S.flip&&pages.length>1;
  area.classList.toggle('is-flip',isFlip);
  deck.classList.toggle('is-flip',isFlip);

  if(!pages.length){
    fi.style.position='static'; fi.style.transform='none'; fi.style.width='auto';
    fo.style.width=''; fo.style.height=''; return;
  }
  fi.style.position='absolute';

  const bx=innerBox(area);
  const aw=Math.max(150,bx.w), ah=Math.max(180,bx.h);
  let ph=0; pages.forEach(p=>{ ph=Math.max(ph,p.offsetHeight||0); });
  if(!ph) ph=700;

  if(isFlip){
    const s=clamp(Math.min(1,(aw-90)/PV_W,(ah-24)/ph),0.2,1);
    /* drop any leftover strip sizing so the stack centres on the stage */
    fi.style.transform='none'; fi.style.width=''; fi.style.height='';
    fo.style.width=''; fo.style.height='';
    /* a freshly built deck must land in place, not animate in from nowhere */
    if(!animate) pages.forEach(p=>{ p.style.transition='none'; });
    pages.forEach(function(p,i){
      const rel=i-S.flipIdx;
      p.dataset.rel=String(clamp(rel,-3,3));
      p.dataset.far=Math.abs(rel)>2?'1':'0';
      const off=rel*Math.min(158,PV_W*0.44)*s;
      const sc=s*(rel===0?1:Math.abs(rel)===1?0.87:0.76);
      const rot=rel===0?0:(rel<0?20:-20);
      p.style.width=PV_W+'px';
      p.style.transform='translate(-50%,-50%) translateX('+off+'px) scale('+sc+') rotateY('+rot+'deg)';
    });
    if(!animate){
      void deck.offsetWidth;                       /* flush, then hand control back to CSS */
      pages.forEach(p=>{ p.style.transition=''; });
    }
    return;
  }

  pages.forEach(p=>{ p.style.transition=''; p.style.transform=''; p.removeAttribute('data-rel'); p.removeAttribute('data-far'); });
  const n=pages.length;
  /* show up to 3 boards side by side; beyond that the strip scrolls sideways */
  let show=1;
  for(let k=Math.min(n,3);k>=1;k--){
    if(aw/(k*PV_W+(k-1)*GAP) >= 0.55){ show=k; break; }
  }
  const s=clamp(Math.min(1, aw/(show*PV_W+(show-1)*GAP)), 0.34, 1);
  const dw=n*PV_W+(n-1)*GAP;
  fi.style.width=dw+'px';
  fi.style.transform='scale('+s+')';
  fo.style.width=(dw*s)+'px';
  fo.style.height=(ph*s+4)+'px';
}

function reparse(keepEdits){
  const raw=curRaw();
  if(S.mode==='chat'){
    const r=parseChat(raw);
    if(keepEdits && S.chat.units.length===r.units.length){
      r.units.forEach(function(u,i){ const o=S.chat.units[i]; if(o){ u.on=o.on; u.text=o.text; } });
    }
    S.chat.units=r.units; S.chat.rooms=r.rooms;
    if(!S.chat.me || participants().indexOf(S.chat.me)<0) S.chat.me=r.me;
    S.chat.room=clamp(S.chat.room,0,Math.max(0,r.rooms.length-1));
  }else{
    const old={}; S.memo.notes.forEach(n=>{ old[n.when+'|'+n.tag]=n; });
    const ns=parseMemo(raw);
    if(keepEdits) ns.forEach(function(n){ const o=old[n.when+'|'+n.tag]; if(o){ n.on=o.on; n.title=o.title; n.body=o.body; n.sub=o.sub; } });
    S.memo.notes=ns;
    S.memo.sel=S.memo.sel.filter(id=>ns.some(n=>n.id===id));
    S.memo.open=-1;
  }
  const b=baseList().length;
  S.range[S.mode]=[1,Math.max(1,b)];
  S.pages[S.mode]=clamp(S.pages[S.mode],1,Math.max(1,b));
  S.flipIdx=0;
  afterDataChange(true);
}
function afterDataChange(rebuildLists){
  paintParseStat();
  paintRoomChips();
  paintMeSelect();
  paintRangeUI();
  if(rebuildLists) paintEditList();
  paintMemoSelInfo();
  renderAll();
}

function paintParseStat(){
  const n=$('#parseStat'); if(!n) return;
  if(!curRaw().trim()){ n.innerHTML=''; return; }
  if(S.mode==='chat'){
    const u=S.chat.units.length, r=S.chat.rooms.length;
    if(!u){ n.className='stat warn'; n.innerHTML=ico('warn',16)+'<span>채팅 형식을 찾지 못했습니다. <b>&lt; 보낸사람 : … / 발신시간 : … / 받는사람 : … &gt;</b> 머리글이 있는지 확인해 주세요.</span>'; return; }
    n.className='stat ok';
    n.innerHTML=ico('check',16)+'<span>말풍선 <b>'+u+'개</b> · 대화방 <b>'+r+'개</b> · 인물 <b>'+participants().length+'명</b></span>';
  }else{
    const m=S.memo.notes.length;
    if(!m){ n.className='stat warn'; n.innerHTML=ico('warn',16)+'<span>메모 형식을 찾지 못했습니다. <b>&lt; 06/02 03:41 / 제목 &gt;</b> 형태의 머리글이 필요합니다.</span>'; return; }
    n.className='stat ok';
    n.innerHTML=ico('check',16)+'<span>메모 <b>'+m+'개</b>를 찾았습니다</span>';
  }
}
function paintRoomChips(){
  const box=$('#roomChips'); if(!box) return;
  box.innerHTML='';
  const rs=S.chat.rooms;
  if(rs.length<=1){ box.innerHTML='<span class="hint" style="margin:0">대화방이 하나뿐입니다.</span>'; return; }
  rs.forEach(function(r,i){
    const other=r.names.filter(x=>x!==S.chat.me);
    const label=(other.length?other.join(', '):r.names.join(' · '));
    const c=el('button','chip'+(i===S.chat.room?' is-on':''));
    c.appendChild(el('span',null,label));
    c.appendChild(el('span','n',String(r.n)));
    on(c,'click',function(){
      S.chat.room=i;
      const b=baseList().length;
      S.range.chat=[1,Math.max(1,b)];
      S.pages.chat=clamp(S.pages.chat,1,Math.max(1,b));
      S.flipIdx=0;
      afterDataChange(true);
    });
    box.appendChild(c);
  });
}
function paintMeSelect(){
  const s=$('#meSel'); if(!s) return;
  const ps=participants();
  s.innerHTML='';
  ps.forEach(function(p){
    const o=document.createElement('option'); o.value=p; o.textContent=p;
    if(p===S.chat.me) o.selected=true;
    s.appendChild(o);
  });
  if(!ps.length){ const o=document.createElement('option'); o.textContent='—'; s.appendChild(o); }
}
function paintMemoSelInfo(){
  const n=$('#memoSelInfo'); if(!n) return;
  const c=S.memo.sel.length;
  n.textContent = c? ('현재 '+c+'개 선택됨.') : '아직 선택된 메모가 없습니다.';
}

let rangeSld=null, pagesSld=null;

function paintRangeUI(){
  const b=baseList().length||1;
  const r=curRange();
  r[0]=clamp(r[0],1,b); r[1]=clamp(r[1],r[0],b);
  if(!rangeSld || rangeSld._n!==b){
    rangeSld=makeSlider($('#rangeSld'),{
      min:1,max:b,step:1,dual:true,value:[r[0],r[1]],
      fmt:function(v,all){ return Array.isArray(all)? (Math.min(all[0],all[1])+'–'+Math.max(all[0],all[1])) : String(v); },
      onInput:function(v){ curRange()[0]=v[0]; curRange()[1]=v[1]; paintRangeText(); markRange(); },
      onChange:function(v){ curRange()[0]=v[0]; curRange()[1]=v[1]; paintRangeText(); markRange(); clampPages(); renderAll(); }
    });
    rangeSld._n=b;
  }else if(!rangeSld.dragging()){ rangeSld.set([r[0],r[1]],true); }
  paintRangeText(); markRange();
}
function paintRangeText(){
  const b=baseList().length||1, r=curRange();
  const a=$('#rangeA'), z=$('#rangeB');
  if(a&&document.activeElement!==a) a.value=r[0];
  if(z&&document.activeElement!==z) z.value=r[1];
  const info=$('#rangeInfo');
  if(info) info.textContent='전체 '+b+'개 중 '+(r[1]-r[0]+1)+'개';
}
function markRange(){
  const r=curRange();
  $$('.el-item',$('#editList')).forEach(function(n){
    const i=+n.dataset.i;
    n.classList.toggle('out-range', i<r[0]-1||i>r[1]-1);
  });
}
function clampPages(){
  const m=Math.max(1,liveList().length);
  S.pages[S.mode]=clamp(S.pages[S.mode],1,m);
  paintPagesSlider();
}
function paintPagesSlider(){
  const m=Math.max(1,liveList().length);
  const lockMulti = S.mode==='memo' && S.memo.open<0 && S.memo.exportWhat!=='home' && S.memo.sel.length>1;
  const max = S.mode==='memo' ? (S.memo.open>=0||S.memo.exportWhat!=='home' ? 40 : m) : m;
  const v=clamp(S.pages[S.mode],1,max);
  S.pages[S.mode]=v;
  if(!pagesSld || pagesSld._max!==max){
    pagesSld=makeSlider($('#pagesSld'),{
      min:1,max:max,step:1,value:v,ticks:true,
      fmt:x=>x+'장',
      onInput:function(x){ $('#pagesVal').textContent=x+'장'; },
      onChange:function(x){ S.pages[S.mode]=x; S.flipIdx=0; renderAll(); }
    });
    pagesSld._max=max;
  }else if(!pagesSld.dragging()){ pagesSld.set(v,true); }
  $('#pagesVal').textContent=v+'장';
  $('#pagesSld').style.opacity=lockMulti?'.4':'';
  $('#pagesSld').style.pointerEvents=lockMulti?'none':'';
  const h=$('#pagesHint');
  if(lockMulti) h.textContent='여러 메모를 선택하면 메모 1개당 1장으로 저장됩니다.';
  else if(S.mode==='chat') h.textContent='말풍선 단위로 잘라 같은 높이의 이미지 '+v+'장을 만듭니다. 최대 '+max+'장까지 나눌 수 있어요.';
  else if(S.memo.open>=0) h.textContent='열어 본 메모의 본문을 '+v+'장으로 나눕니다.';
  else if(S.memo.exportWhat==='home') h.textContent='홈 화면을 메모 단위로 잘라 '+v+'장으로 나눕니다. 최대 '+max+'장.';
  else h.textContent='선택한 메모 1개를 '+v+'장으로 나눕니다.';
  const sh=$('#sizeHint');
  if(sh) sh.textContent='가로 '+(PV_W*S.scale)+'px 기준으로 저장됩니다.';
}

let editingId=null;

function paintEditList(){
  const box=$('#editList'); if(!box) return;
  box.innerHTML='';
  const list=baseList();
  if(!list.length){
    box.innerHTML='<div class="stat">'+ico('info',16)+'<span>먼저 <b>붙여넣기</b> 탭에서 내용을 넣어 주세요.</span></div>';
    $('#elCount').textContent='';
    return;
  }
  let lastKey=null;
  list.forEach(function(u,i){
    const key = S.mode==='chat' ? (u.who+' · '+u.time) : (memoShortLabel(u)||'기타');
    if(key!==lastKey){ box.appendChild(el('div','el-grp',key)); lastKey=key; }
    box.appendChild(itemNode(u,i,list));
    if(editingId===u.id) box.appendChild(editorNode(u,i,list));
  });
  const onN=list.filter(u=>u.on!==false).length;
  $('#elCount').textContent=onN+' / '+list.length+' 선택';
  markRange();
}

function itemNode(u,i,list){
  const n=el('div','el-item'+(u.on===false?' is-off':'')+(editingId===u.id?' is-edit':''));
  n.dataset.i=i;
  const cb=el('div','cb'+(u.on!==false?' is-on':''));
  cb.innerHTML=ico('check',11);
  cb.setAttribute('role','checkbox');
  on(cb,'click',function(){ u.on=(u.on===false); paintEditList(); clampPages(); renderAll(); });
  n.appendChild(cb);

  const main=el('div','el-main');
  const head=el('div','el-head');
  if(S.mode==='chat'){
    head.appendChild(el('div','el-who',u.who));
    head.appendChild(el('div','el-when',u.time||''));
    if(u.who===S.chat.me) head.appendChild(el('span','el-badge me','나'));
    if(u.mis) head.appendChild(el('span','el-badge','잘못 보냄 → '+u.mis));
  }else{
    head.appendChild(el('div','el-who',plain(u.title)||'제목 없음'));
    head.appendChild(el('div','el-when',u.when||''));
    if(u.tag) head.appendChild(el('span','el-badge tag',u.tag));
  }
  main.appendChild(head);
  const tx=el('div','el-txt rt');
  tx.innerHTML=richHTML(S.mode==='chat'?u.text:(u.sub||plain(u.body).slice(0,90)))||'<span style="opacity:.5">(내용 없음)</span>';
  main.appendChild(tx);
  n.appendChild(main);

  const acts=el('div','el-acts');
  const mk=(name,title,cls,fn)=>{ const b=el('button','mini'+(cls?' '+cls:'')); b.innerHTML=ico(name,15); b.title=title; on(b,'click',fn); return b; };
  acts.appendChild(mk('pencil','수정','', function(){ editingId=(editingId===u.id?null:u.id); paintEditList(); }));
  acts.appendChild(mk('copy','복제','', function(){ dupItem(i); }));
  acts.appendChild(mk('trash','삭제','del', function(){ delItem(i); }));
  n.appendChild(acts);
  return n;
}

function srcArray(){ return S.mode==='chat' ? S.chat.units : S.memo.notes; }
function srcIndex(u){ const a=srcArray(); for(let i=0;i<a.length;i++) if(a[i]===u) return i; return -1; }

function dupItem(i){
  const list=baseList(), u=list[i], a=srcArray(), k=srcIndex(u);
  if(k<0) return;
  const c=deep(u); c.id=(S.mode==='chat'?'c':'m')+'dup_'+uid();
  a.splice(k+1,0,c);
  structuralChange();
}
function delItem(i){
  const list=baseList(), u=list[i], a=srcArray(), k=srcIndex(u);
  if(k<0) return;
  a.splice(k,1);
  if(S.mode==='memo') S.memo.sel=S.memo.sel.filter(x=>x!==u.id);
  if(editingId===u.id) editingId=null;
  structuralChange();
}
function moveItem(i,d){
  const list=baseList(), u=list[i], a=srcArray(), k=srcIndex(u);
  const t=k+d;
  if(k<0||t<0||t>=a.length) return;
  a.splice(t,0,a.splice(k,1)[0]);
  structuralChange();
}
function structuralChange(){
  const b=baseList().length||1;
  const r=curRange();
  r[0]=clamp(r[0],1,b); r[1]=clamp(r[1],r[0],b);
  if(S.memo.open>=b) S.memo.open=-1;
  paintRangeUI(); paintEditList(); clampPages(); paintMemoSelInfo(); renderAll();
}

function editorNode(u,i,list){
  const n=el('div','el-edit');
  const add=(label,val,set,multi)=>{
    const f=el('div','field');
    f.appendChild(el('span','lab',label));
    const inp=document.createElement(multi?'textarea':'input');
    inp.className=multi?'ta':'inp';
    if(multi) inp.rows=Math.min(9,Math.max(3,String(val||'').split('\n').length+1));
    inp.value=val==null?'':val;
    f.appendChild(inp);
    bindText(inp,()=>val,function(v,live){ val=v; set(v); if(!live) paintEditList(); renderSoon(); });
    return {f:f,inp:inp};
  };

  if(S.mode==='chat'){
    const row=el('div','inp-row'); row.style.marginBottom='12px';
    const w=add('보낸 사람',u.who,v=>{u.who=v;}); w.f.style.flex='1';
    const t=add('시간',u.time,v=>{u.time=v;}); t.f.style.width='110px'; t.f.style.flex='0 0 auto';
    w.f.style.marginBottom='0'; t.f.style.marginBottom='0';
    row.appendChild(w.f); row.appendChild(t.f); n.appendChild(row);
    const b=add('내용',u.text,v=>{u.text=v;},true);
    n.appendChild(fmtBar(b.inp));
    n.appendChild(b.f);
  }else{
    const row=el('div','inp-row'); row.style.marginBottom='12px';
    const w=add('날짜·시간',u.when,v=>{ u.when=v; const d=memoDate(v); u.mo=d.mo;u.dy=d.dy;u.hh=d.hh;u.mi=d.mi;u.ord=d.ord; }); w.f.style.flex='1';
    const t=add('표식',u.tag,v=>{u.tag=v;}); t.f.style.width='120px'; t.f.style.flex='0 0 auto';
    w.f.style.marginBottom='0'; t.f.style.marginBottom='0';
    row.appendChild(w.f); row.appendChild(t.f); n.appendChild(row);
    const ti=add('제목',u.title,v=>{u.title=v;});
    n.appendChild(fmtBar(ti.inp)); n.appendChild(ti.f);
    const b=add('본문',u.body,function(v){ u.body=v; const rl=v.split('\n'); u.sub=''; for(let k=0;k<rl.length;k++){ if(rl[k].trim()){u.sub=rl[k].trim();break;} } },true);
    n.appendChild(fmtBar(b.inp)); n.appendChild(b.f);
  }

  const acts=el('div','btn-row'); acts.style.marginTop='10px';
  const up=el('button','btn sm'); up.innerHTML=ico('up',14)+'위로'; on(up,'click',()=>moveItem(i,-1));
  const dn=el('button','btn sm'); dn.innerHTML=ico('down',14)+'아래로'; on(dn,'click',()=>moveItem(i,1));
  const done=el('button','btn sm ink-btn'); done.textContent='완료'; done.style.marginLeft='auto';
  on(done,'click',function(){ editingId=null; paintEditList(); });
  acts.appendChild(up); acts.appendChild(dn); acts.appendChild(done);
  n.appendChild(acts);
  return n;
}

function fmtBar(inp){
  const bar=el('div','fmt-bar');
  const defs=[['B','**','**','b','굵게'],['I','*','*','i','기울임'],['S','~~','~~','s','취소선'],
              ['작게','<small>','</small>','','작게'],['크게','<big>','</big>','','크게'],
              ['줄바꿈','\n','','','줄 바꾸기']];
  defs.forEach(function(d){
    const b=el('button','fmt'+(d[3]?' '+d[3]:''),d[0]);
    b.title=d[4]; b.type='button';
    on(b,'mousedown',e=>e.preventDefault());
    on(b,'click',function(){
      const s=inp.selectionStart||0, e=inp.selectionEnd||0, v=inp.value;
      const sel=v.slice(s,e);
      inp.value=v.slice(0,s)+d[1]+sel+d[2]+v.slice(e);
      inp.focus();
      inp.selectionStart=s+d[1].length; inp.selectionEnd=s+d[1].length+sel.length;
      inp.dispatchEvent(new Event('input',{bubbles:true}));
      inp.dispatchEvent(new Event('change',{bubbles:true}));
    });
    bar.appendChild(b);
  });
  return bar;
}

let thFilter='all';

function allThemes(){ return THEMES.concat(S.custom); }

function themeChip(t){
  const c = S.mode==='chat' ? t.chat : t.memo;
  const b=el('button','th'+(t.id===S.themeId?' is-on':'')+(t.custom?' custom':''));
  b.title=t.name;
  const inner=el('div','th-in');
  inner.style.background=bgCss(c);
  const bar=el('div','th-bar'); bar.style.background=c.barBg;
  const bt=el('b'); bt.style.background=c.barText; bar.appendChild(bt);
  inner.appendChild(bar);
  const body=el('div','th-body');
  if(S.mode==='chat'){
    const l=el('div','th-bb l'); l.style.background=c.youBg;
    const li=el('i'); li.style.background=c.youText; l.appendChild(li);
    const r=el('div','th-bb r'); r.style.background=c.meBg;
    const ri=el('i'); ri.style.background=c.meText; r.appendChild(ri);
    body.appendChild(l); body.appendChild(r);
  }else{
    ['a','b'].forEach(function(k){
      const cd=el('div','th-card '+k); cd.style.background=c.cardBg;
      const u=document.createElement('u'); u.style.background=c.titleCol;
      const s2=document.createElement('s'); s2.style.background=c.subCol;
      cd.appendChild(u); cd.appendChild(s2);
      body.appendChild(cd);
    });
  }
  inner.appendChild(body);
  b.appendChild(inner);
  b.appendChild(el('div','th-name',t.name));
  const ck=el('div','th-check'); ck.innerHTML=ico('check',10); b.appendChild(ck);
  if(t.custom){
    const dl=el('div','th-del'); dl.innerHTML=ico('x',10); dl.title='이 테마 삭제';
    on(dl,'click',function(e){
      e.stopPropagation();
      confirmBox('테마 삭제','<b>'+esc(t.name)+'</b> 테마를 삭제할까요? 되돌릴 수 없습니다.','삭제',function(){
        S.custom=S.custom.filter(x=>x.id!==t.id);
        if(S.themeId===t.id) S.themeId='';
        paintThemeGrid(); save(); toast('테마를 삭제했습니다');
      },true);
    });
    b.appendChild(dl);
  }
  on(b,'click',function(){ applyTheme(t); });
  return b;
}

function paintThemeGrid(){
  const f=$('#thFilter');
  if(f){
    f.innerHTML='';
    const groups=[['all','전체'],['기본','기본'],['단색','단색'],['팔레트','팔레트'],['내 테마','내 테마']];
    groups.forEach(function(g){
      if(g[0]==='내 테마' && !S.custom.length) return;
      const c=el('button','chip'+(thFilter===g[0]?' is-on':''),g[1]);
      on(c,'click',function(){ thFilter=g[0]; paintThemeGrid(); });
      f.appendChild(c);
    });
  }
  const g=$('#thGrid'); if(!g) return;
  g.innerHTML='';
  allThemes().forEach(function(t){
    const grp=t.custom?'내 테마':(t.grp||'기본');
    if(thFilter!=='all' && grp!==thFilter) return;
    g.appendChild(themeChip(t));
  });
  if(!g.children.length) g.innerHTML='<p class="hint">해당 그룹의 테마가 없습니다.</p>';
}

function applyTheme(t){
  S.theme.chat=Object.assign(deep(CHAT_DEF),deep(t.chat||{}));
  S.theme.memo=Object.assign(deep(MEMO_DEF),deep(t.memo||{}));
  S.themeId=t.id;
  paintThemeGrid(); paintThemeEditor(true); renderAll();
  toast(t.name+' 테마를 적용했습니다');
}

/* ---------- readability repair ---------- */
function fixReadability(){
  const t=T();
  if(S.mode==='chat'){
    t.meText   = ensure(t.meText,t.meBg,4.5);
    t.youText  = ensure(t.youText,t.youBg,4.5);
    t.barText  = ensure(t.barText,t.barBg,4.5);
    t.nameCol  = ensure(t.nameCol,t.bg1,3.2);
    t.timeCol  = ensure(t.timeCol,t.bg1,2.6);
    t.dateText = ensure(t.dateText,t.dateBg,4.5);
    t.misText  = ensure(t.misText,t.misBg,4.5);
    t.youBg    = separate(t.youBg,t.bg1,1.14);
    t.meBg     = separate(t.meBg,t.bg1,1.14);
  }else{
    t.titleCol = ensure(t.titleCol,t.cardBg,7);
    t.bodyCol  = ensure(t.bodyCol,t.cardBg,4.5);
    t.subCol   = ensure(t.subCol,t.cardBg,3.2);
    t.barText  = ensure(t.barText,t.barBg,4.5);
    t.tagText  = ensure(t.tagText,t.tagBg,4.5);
    t.accent   = ensure(t.accent,t.cardBg,2.2);
    t.cardBg   = separate(t.cardBg,t.bg1,1.08);
  }
  paintThemeEditor(true); renderAll();
  toast('대비가 부족한 색을 보정했습니다');
}
function contrastReport(){
  const t=T(), out=[];
  const chk=(lab,fg,bg,min)=>{ const c=contrast(fg,bg); if(c<min) out.push(lab+' '+c.toFixed(1)+':1'); };
  if(S.mode==='chat'){
    chk('내 말풍선',t.meText,t.meBg,4.5);
    chk('상대 말풍선',t.youText,t.youBg,4.5);
    chk('상단바',t.barText,t.barBg,4.5);
    chk('이름',t.nameCol,t.bg1,3);
    chk('시간',t.timeCol,t.bg1,2.5);
  }else{
    chk('제목',t.titleCol,t.cardBg,6);

let _thKey='';
function fold(title,dotCol,open){
  const f=el('div','fold'+(open?' is-open':''));
  const h=el('button','fold-h');
  if(dotCol){ const d=el('span','fold-dot'); d.style.background=dotCol; h.appendChild(d); }
  h.appendChild(el('span',null,title));
  const ch=el('span','chev'); ch.innerHTML=ico('chev',14); h.appendChild(ch);
  const b=el('div','fold-b');
  on(h,'click',()=>f.classList.toggle('is-open'));
  f.appendChild(h); f.appendChild(b);
  f._body=b; f._dot=dotCol?$('.fold-dot',h):null;
  return f;
}
function sldField(label,get,set,min,max,step,unit){
  const f=el('div','field');
  const lab=el('span','lab'); lab.appendChild(el('span',null,label));
  const val=el('span','val'); lab.appendChild(val); f.appendChild(lab);
  const node=el('div','sld'); f.appendChild(node);
  const fmt=v=>(Math.round(v*10)/10)+unit;
  const api=makeSlider(node,{min:min,max:max,step:step,value:get(),fmt:fmt,
    onInput:function(v){ val.textContent=fmt(v); set(v); renderSoon(); },
    onChange:function(v){ val.textContent=fmt(v); set(v); renderAll(); paintThemeGrid(); }});
  val.textContent=fmt(get());
  f._sync=function(){ api.set(get(),true); val.textContent=fmt(get()); };
  return f;
}
function colField(label,key,againstKey){
  const t=()=>T();
  return colorRow(label,()=>t()[key],function(v){ t()[key]=v; renderSoon(); paintThemeGrid(); save(); },
    againstKey?()=>t()[againstKey]:null);
}
function swField(title,desc,key){
  return switchRow(title,desc,()=>!!T()[key],function(v){ T()[key]=v; renderAll(); paintThemeGrid(); });
}
function choiceRow(label,opts,get,set){
  const f=el('div','field');
  f.appendChild(el('span','lab',label));
  const c=el('div','choice');
  opts.forEach(function(o){
    const b=el('button','choice-b'+(get()===o[0]?' is-on':''),o[1]);
    b.dataset.v=o[0];
    on(b,'click',function(){ set(o[0]); $$('.choice-b',c).forEach(x=>x.classList.toggle('is-on',x.dataset.v===String(get()))); renderAll(); paintThemeGrid(); });
    c.appendChild(b);
  });
  f.appendChild(c);
  f._sync=function(){ $$('.choice-b',c).forEach(x=>x.classList.toggle('is-on',x.dataset.v===String(get()))); };
  return f;
}

function syncEditor(box){

    '<span>대비가 낮아 읽기 어려울 수 있어요 — <b>'+esc(bad.join(', '))+'</b></span></div>';
}

/* ============================================================
   MODE / TABS
   ============================================================ */
function applyMode(){
  $$('[data-mode]',$('#modeSeg')).forEach(function(b){
    const on2=b.dataset.mode===S.mode;
    b.classList.toggle('is-on',on2); b.setAttribute('aria-selected',String(on2));
  });
  moveSegInd();
  $$('[data-only]').forEach(n=>{ n.style.display = n.dataset.only===S.mode ? '' : 'none'; });
  $('#raw').value=curRaw();
  $('#raw').placeholder = S.mode==='chat'
    ? 'AI가 출력한 채팅 내역을 통째로 붙여넣으세요.\nOOC 지시문·하단 메타정보는 자동으로 걸러집니다.'
    : 'AI가 출력한 메모장 내용을 통째로 붙여넣으세요.\n< 06/02 03:41 / 제목 > 형태의 머리글을 기준으로 나눕니다.';
  paintStageTools();
  _thKey='';
  reparseIfNeeded();
  paintThemeGrid(); paintThemeEditor(true);
  syncInputs();
  afterDataChange(true);
}
function reparseIfNeeded(){
  const has = S.mode==='chat' ? S.chat.units.length : S.memo.notes.length;
  if(!has && curRaw().trim()) reparse(false);
}
function moveSegInd(){
  const seg=$('#modeSeg'), ind=$('#segInd');
  const b=$('.seg-btn.is-on',seg); if(!b) return;
  ind.style.width=b.offsetWidth+'px';
  ind.style.transform='translateX('+(b.offsetLeft-3)+'px)';
}
function setTab(name){
  $$('.tab').forEach(t=>t.classList.toggle('is-on',t.dataset.tab===name));
  $$('.pane').forEach(p=>p.classList.toggle('is-on',p.dataset.pane===name));
  if(name==='theme') paintThemeEditor(false);
  if(name==='export') paintPagesSlider();
}

/* ---------- stage tools (memo view/pick switch) ---------- */
function paintStageTools(){
  const host=$('.stage-tools');
  let extra=$('#stageExtra');
  if(extra) extra.remove();
  if(S.mode!=='memo') return;
  extra=el('div'); extra.id='stageExtra'; extra.style.cssText='display:flex;gap:4px;margin-right:2px';
  if(S.memo.open>=0){
    const b=el('button','btn sm'); b.innerHTML=ico('left',14)+'홈으로';
    on(b,'click',function(){ S.memo.open=-1; paintStageTools(); renderAll(); });
    extra.appendChild(b);
  }else{
    const b=el('button','btn sm'+(S.memo.pick?' ink-btn':''));
    b.innerHTML=ico('check',14)+(S.memo.pick?'선택 중':'메모 고르기');
    b.title='카드를 눌러 내보낼 메모를 고릅니다';
    on(b,'click',function(){ S.memo.pick=!S.memo.pick; paintStageTools(); renderAll(); });
    extra.appendChild(b);
  }
  host.insertBefore(extra,host.firstChild);
}

/* ============================================================
   WIRING
   ============================================================ */
function wire(){
  hydrateIcons(document);

  /* mode */
  $$('[data-mode]',$('#modeSeg')).forEach(function(b){
    on(b,'click',function(){ if(S.mode===b.dataset.mode) return; S.mode=b.dataset.mode; S.flipIdx=0; applyMode(); save(); });
  });

  /* tabs */
  $$('.tab').forEach(t=>on(t,'click',()=>setTab(t.dataset.tab)));

  /* raw input */
  const raw=$('#raw');
  bindText(raw,()=>curRaw(),function(v,live){
    S.raw[S.mode]=v;
    if(!live){ reparse(false); } else { reparse(false); }
  });
  on($('#btnParse'),'click',function(){ S.raw[S.mode]=raw.value; reparse(false); toast('다시 분석했습니다'); });
  on($('#btnClearRaw'),'click',function(){
    if(!curRaw().trim()) return;
    confirmBox('내용 비우기','붙여넣은 원본과 편집 내용이 모두 지워집니다.','비우기',function(){
      S.raw[S.mode]=''; raw.value=''; reparse(false); toast('비웠습니다');
    },true);
  });
  on($('#btnSample'),'click',function(){
    S.raw[S.mode]= S.mode==='chat'?SAMPLE_CHAT:SAMPLE_MEMO;
    raw.value=curRaw(); reparse(false);
    if(S.mode==='chat' && !S.chat.dateLine) { S.chat.dateLine='2026년 9월 18일 금요일'; syncInputs(); }
    toast('예시를 불러왔습니다');
  });
  on($('#btnPaste'),'click',async function(){
    try{
      const t=await navigator.clipboard.readText();
      if(!t){ toast('클립보드가 비어 있습니다','warn'); return; }
      S.raw[S.mode]=t; raw.value=t; reparse(false); toast('붙여넣었습니다');
    }catch(e){ toast('브라우저가 막았습니다. 입력창에 직접 붙여넣어 주세요.','warn'); }
  });

  /* chat options */
  bindText($('#roomName'),()=>S.chat.roomName,function(v){ S.chat.roomName=v; renderSoon(); save(); });
  bindText($('#chatDate'),()=>S.chat.dateLine,function(v){ S.chat.dateLine=v; renderSoon(); save(); });
  on($('#meSel'),'change',function(){ S.chat.me=$('#meSel').value; paintRoomChips(); paintEditList(); renderAll(); });

  /* memo options */
  bindText($('#memoTitle'),()=>S.memo.appTitle,function(v){ S.memo.appTitle=v; renderSoon(); save(); });
  bindChoice('memoStyle',()=>S.memo.style,function(v){ S.memo.style=v; renderAll(); });
  bindChoice('memoGroup',()=>S.memo.group,function(v){ S.memo.group=v; renderAll(); });
  bindChoice('memoSort',()=>S.memo.sort,function(v){ S.memo.sort=v; S.memo.open=-1; paintEditList(); paintRangeUI(); renderAll(); });
  bindChoice('memoExport',()=>S.memo.exportWhat,function(v){ S.memo.exportWhat=v; paintPagesSlider(); renderAll(); });
  bindChoice('scale',()=>String(S.scale),function(v){ S.scale=+v; paintPagesSlider(); save(); });

  /* range */
  bindNum($('#rangeA'),()=>curRange()[0],function(v){ const r=curRange(); r[0]=Math.min(v,r[1]); paintRangeUI(); clampPages(); renderAll(); },
    ()=>1,()=>curRange()[1]);
  bindNum($('#rangeB'),()=>curRange()[1],function(v){ const r=curRange(); r[1]=Math.max(v,r[0]); paintRangeUI(); clampPages(); renderAll(); },
    ()=>curRange()[0],()=>Math.max(1,baseList().length));
  on($('#btnRangeAll'),'click',function(){ const b=Math.max(1,baseList().length); S.range[S.mode]=[1,b]; paintRangeUI(); clampPages(); renderAll(); });

  on($('#btnSelAll'),'click',function(){ baseList().forEach(u=>u.on=true); paintEditList(); clampPages(); renderAll(); });
  on($('#btnSelNone'),'click',function(){ baseList().forEach(u=>u.on=false); paintEditList(); clampPages(); renderAll(); });
  on($('#btnSelInv'),'click',function(){ baseList().forEach(u=>u.on=(u.on===false)); paintEditList(); clampPages(); renderAll(); });

  /* theme */
  on($('#btnThSave'),'click',saveCustomTheme);
  on($('#btnThReset'),'click',function(){
    const t=findTheme(S.themeId);
    if(t){ applyTheme(t); } else { applyTheme(THEMES[0]); }
  });
  on($('#btnThExport'),'click',function(){
    const t={id:'exp_'+uid(),name:(findTheme(S.themeId)||{}).name||'내 테마',custom:true,
             chat:deep(S.theme.chat),memo:deep(S.theme.memo)};
    downloadText(JSON.stringify({rrmakerTheme:1,theme:t},null,2),safeName(t.name)+'.rrtheme.json');
    toast('테마 파일을 내려받았습니다');
  });
  on($('#btnThImport'),'click',()=>$('#thFile').click());
  on($('#thFile'),'change',function(){
    const f=this.files&&this.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=function(){
      try{
        const d=JSON.parse(r.result);
        const t=d.theme||d;
        if(!t.chat&&!t.memo) throw 0;
        t.id='imp_'+uid(); t.custom=true; t.name=t.name||'가져온 테마';
        t.chat=Object.assign(deep(CHAT_DEF),t.chat||{});
        t.memo=Object.assign(deep(MEMO_DEF),t.memo||{});
        S.custom.push(t); applyTheme(t); thFilter='내 테마'; paintThemeGrid(); save();
      }catch(e){ toast('테마 파일을 읽지 못했습니다','warn'); }
    };
    r.readAsText(f); this.value='';
  });

  /* export */
  bindText($('#fileName'),()=>S.fileName[S.mode],function(v){ S.fileName[S.mode]=v; paintFileHint(); save(); });
  on($('#btnExport'),'click',function(){ EXPORTING=true; renderAll(); setTimeout(function(){ exportPNG().then(()=>{EXPORTING=false;renderAll();}); },30); });

  /* data */
  on($('#btnDataExport'),'click',function(){
    downloadText(JSON.stringify(snap(),null,2),'룽룽씨_작업_'+new Date().toISOString().slice(0,10)+'.json');
    toast('작업 파일을 내려받았습니다');
  });
  on($('#btnDataImport'),'click',()=>$('#dataFile').click());
  on($('#dataFile'),'change',function(){
    const f=this.files&&this.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=function(){
      try{
        localStorage.setItem(LSK,r.result);
        if(!load()) throw 0;
        boot(true); toast('작업을 불러왔습니다');
      }catch(e){ toast('작업 파일을 읽지 못했습니다','warn'); }
    };
    r.readAsText(f); this.value='';
  });
  on($('#btnResetAll'),'click',function(){
    confirmBox('모두 초기화','저장된 원본·편집·테마가 전부 지워집니다. 되돌릴 수 없습니다.','초기화',function(){
      try{ localStorage.removeItem(LSK); }catch(e){}
      location.reload();
    },true);
  });

  /* stage */
  on($('#btnFlip'),'click',function(){
    S.flip=!S.flip; this.classList.toggle('is-on',S.flip);
    if(S.flip) toast('플립 모드 — 좌우로 넘겨 보세요');
    renderAll();
  });
  on($('#btnStatusBar'),'click',function(){
    S.statusBar=!S.statusBar; this.classList.toggle('is-on',S.statusBar); renderAll();
  });
  $('#btnStatusBar').classList.toggle('is-on',S.statusBar);

  /* deck interaction */
  const deck=$('#deck');
  on(deck,'click',function(e){
    const card=e.target.closest('[data-note]');
    if(!card||S.mode!=='memo') return;
    const id=card.dataset.note;
    if(S.memo.pick){
      const i=S.memo.sel.indexOf(id);
      if(i>=0) S.memo.sel.splice(i,1); else S.memo.sel.push(id);
      paintMemoSelInfo(); paintPagesSlider(); renderAll();
    }else{
      const list=liveList();
      const k=list.findIndex(n=>n.id===id);
      if(k>=0){ S.memo.open=k; paintStageTools(); paintPagesSlider(); renderAll(); }
    }
  });

  /* flip: swipe + keys */
  let sx=null;
  on($('#stageArea'),'pointerdown',function(e){ if(S.flip) sx=e.clientX; });
  on($('#stageArea'),'pointerup',function(e){
    if(!S.flip||sx==null) return;
    const d=e.clientX-sx; sx=null;
    if(Math.abs(d)>42) flipTo(S.flipIdx+(d<0?1:-1));
  });
  on(document,'keydown',function(e){
    if(/input|textarea|select/i.test((e.target.tagName||''))) return;
    if(!S.flip) return;
    if(e.key==='ArrowRight'){ flipTo(S.flipIdx+1); e.preventDefault(); }
    if(e.key==='ArrowLeft'){ flipTo(S.flipIdx-1); e.preventDefault(); }
  });

  /* ui theme */
  on($('#btnUiTheme'),'click',function(){
    S.ui = S.ui==='auto'?'light':S.ui==='light'?'dark':'auto';
    applyUiTheme(); save();
  });
  on($('#btnHelp'),'click',showHelp);

  /* resize */
  let rt;
  on(window,'resize',function(){ clearTimeout(rt); rt=setTimeout(function(){ moveSegInd(); layoutDeck(false); },110); });
  on(window,'orientationchange',function(){ setTimeout(function(){ moveSegInd(); layoutDeck(false); },260); });
  on(document,'visibilitychange',function(){ if(!document.hidden) paintSaveStat(); });
  on(window,'beforeunload',function(){ try{ localStorage.setItem(LSK,JSON.stringify(snap())); }catch(e){} });
}

function paintFileHint(){
  const h=$('#fileHint'); if(!h) return;
  h.textContent='예: '+exportBase()+'.png';
}
function saveCustomTheme(){
  const bg=$('#sheetBg'), sh=$('#sheet');
  sh.innerHTML='<h3>테마 저장</h3><p>지금 설정한 색과 크기를 새 테마로 저장합니다. 이름을 지어 주세요.</p>'+
    '<input class="inp" id="thName" style="margin-top:14px" maxlength="20" placeholder="예: 슬럼 야경">'+
    '<div class="sheet-acts"><button class="btn" data-x="no">취소</button>'+
    '<button class="btn ink-btn" data-x="yes">저장</button></div>';
  bg.classList.add('is-on');
  const inp=$('#thName',sh); setTimeout(()=>inp.focus(),60);
  const close=()=>bg.classList.remove('is-on');
  $('[data-x="no"]',sh).onclick=close;
  const go=function(){
    const nm=(inp.value||'').trim()||('내 테마 '+(S.custom.length+1));
    const t={id:'my_'+uid(),name:nm,custom:true,chat:deep(S.theme.chat),memo:deep(S.theme.memo)};
    S.custom.push(t); S.themeId=t.id;
    thFilter='내 테마'; paintThemeGrid(); save(); close();
    toast('‘'+nm+'’ 테마를 저장했습니다');
  };
  $('[data-x="yes"]',sh).onclick=go;
  inp.onkeydown=e=>{ if(e.key==='Enter') go(); };
  bg.onclick=e=>{ if(e.target===bg) close(); };
}
function showHelp(){
  infoBox('사용법',
   '<b>1. 붙여넣기</b> — AI 출력을 통째로 붙여넣으면 OOC 지시문·하단 메타정보를 자동으로 걸러내고 '+
   '말풍선/메모 단위로 나눕니다.<br><br>'+
   '<b>2. 선택·편집</b> — 범위 슬라이더로 어디부터 어디까지 뽑을지 정하고, 항목을 눌러 내용을 고치거나 지웁니다.<br><br>'+
   '<b>3. 테마</b> — 색 미리보기를 누르면 바로 적용됩니다. 직접 꾸민 뒤 <b>테마로 저장</b>하면 다음에도 쓸 수 있어요.<br><br>'+
   '<b>4. 내보내기</b> — 장수를 정하면 같은 높이의 PNG 여러 장으로 잘립니다. 플립 버튼으로 넘겨 보며 확인하세요.<br><br>'+
   '<span style="color:var(--text-3)">작성 중인 내용은 이 브라우저에 자동 저장되어, 창을 닫았다 열어도 그대로 이어집니다. '+
   '<b>**굵게**</b>, <i>*기울임*</i>, <s>~~취소선~~</s>, &lt;small&gt; 같은 표기는 그대로 살아납니다.</span>');
}
function applyUiTheme(){
  const sys = window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  const eff = S.ui==='auto' ? (sys?'dark':'light') : S.ui;
  document.documentElement.setAttribute('data-ui',eff);
  const b=$('#btnUiTheme');
  if(b){
    b.innerHTML=ico(eff==='dark'?'sun':'moon');
    b.title = S.ui==='auto'?'자동 (시스템 설정)':S.ui==='light'?'밝게':'어둡게';
    b.classList.toggle('is-on',S.ui!=='auto');
  }
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(reload){
  if(!reload){
    const had=load();
    if(!had) applyTheme(THEMES[0]);
  }
  applyUiTheme();                       /* after load(), so a saved light/dark choice sticks */
  $('#btnStatusBar').classList.toggle('is-on',S.statusBar);
  $('#btnFlip').classList.toggle('is-on',S.flip);
  $('#raw').value=curRaw();
  applyMode();
  paintFileHint();
  paintSaveStat();
  paintThemeGrid();
  paintThemeEditor(true);
  syncInputs();
  setTab('input');
  moveSegInd();
  renderAll();
}

document.addEventListener('DOMContentLoaded',function(){
  try{
    wire();
    boot(false);
    if(window.matchMedia){
      const mq=window.matchMedia('(prefers-color-scheme: dark)');
      (mq.addEventListener?mq.addEventListener.bind(mq,'change'):mq.addListener.bind(mq))(function(){ if(S.ui==='auto') applyUiTheme(); });
    }
  }catch(e){
    console.error(e);
    document.body.insertAdjacentHTML('afterbegin',
      '<div style="padding:20px;font:14px system-ui;color:#c00">초기화 중 오류: '+esc(e.message)+'</div>');
  }
});
</script>
