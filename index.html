function ensure(fg,bg,min){
  let c=hx(fg)||'#000000', i=0;
  /* the pole that genuinely gives the most contrast against bg — not merely the opposite of fg */
  const dir = contrast('#0A0B0D',bg) >= contrast('#FFFFFF',bg) ? '#0A0B0D' : '#FFFFFF';
  while(contrast(c,bg)<min && i++<30) c=mix(c,dir,0.09);
  return contrast(c,bg)>=min ? c : dir;
}
function separate(a,bg,min){
  let c=hx(a)||'#FFFFFF', i=0;
  const dir = lum(bg)>0.5 ? '#000000' : '#FFFFFF';
  while(contrast(c,bg)<min && i++<14) c=mix(c,dir,0.06);
  return c;
}

/* a fill that no text colour can sit on legibly is pushed toward its nearer pole */
function fitFill(c,minTxt){
  let x=hx(c)||'#888888', i=0;
  const dir = lum(x)>0.5 ? '#FFFFFF' : '#0A0B0D';
  while(Math.max(contrast(x,'#FFFFFF'),contrast(x,'#0A0B0D'))<minTxt && i++<30) x=mix(x,dir,0.06);
  return x;
}

/* A memo accent that is merely darkened until it clears a contrast ratio comes out
   dusty. Lift the saturation first and keep it, then hunt for the lightness that
   clears the ratio — the colour stays lively instead of going muddy. */
function vivid(c,dark){
  const x=hx(c)||'#888888';
  if(chroma(x)<0.045) return x;            /* achromatic accents stay achromatic */
  const H=hsl(x);
  const s=clamp(H[1]*1.30+(H[1]<0.25?0.14:0.10),0,1);
  const l=dark ? clamp(Math.max(H[2],0.58),0,0.80)
               : clamp(Math.min(Math.max(H[2],0.45),0.62),0,1);
  return fromHsl(H[0],s,l);
}
/* A memo page should read as paper with the theme breathed into it: high lightness,
   low chroma. A bright but saturated tint reads as a highlighter, not paper — so take
   the lightness up first, then wash the colour out until only a calm hint is left. */
function paperTint(c,maxChroma,minLit){
  const H=hsl(hx(c)||'#FFFFFF');
  let out=fromHsl(H[0],H[1],Math.max(H[2],minLit));
  let i=0;
  while(chroma(out)>maxChroma && i++<40) out=mix(out,'#FFFFFF',0.08);
  return out;
}
/* The card has to stay the lightest thing on screen. A page washed brighter than this
   leaves a white card nowhere left to go, so walk the page's lightness back down —
   hue and saturation untouched, only the tone moves. */
function capLum(c,maxLum){
  let H=hsl(hx(c)||'#FFFFFF'), out=hx(c)||'#FFFFFF', i=0;
  while(lum(out)>maxLum && i++<70){ H=[H[0],H[1],H[2]-0.008]; out=fromHsl(H[0],H[1],H[2]); }
  return out;
}
function vividOn(c,bg,min,dark){
  const v=vivid(c,dark);
  if(contrast(v,bg)>=min) return v;
  const H=hsl(v), down=lum(bg)>0.5;
  for(let i=1;i<=28;i++){
    const t=fromHsl(H[0],H[1],down?H[2]-i*0.025:H[2]+i*0.025);
    if(contrast(t,bg)>=min) return t;
  }
  return ensure(v,bg,min);                  /* last resort: the plain pole walk */
}

/* The gradient's second stop is derived, never hand-picked: take the wallpaper,
   breathe a little of the theme's accent into it, step the lightness away from the
   middle, then pull it back until the two ends read as one surface rather than two
   colours. Subtle by construction. */
function autoGrad(base,accent,dark){
  const tinted = accent ? mix(base,accent,0.16) : base;
  const H = hsl(tinted);
  const end0 = fromHsl(H[0], clamp(H[1]*1.06,0,1), clamp(H[2]+(dark?0.075:-0.10),0.03,0.97));
  let end=end0, i=0;
  while(contrast(end,base)>1.9 && i++<14) end=mix(end,base,0.15);
  if(contrast(end,base)<1.035) end=mix(end, dark?'#FFFFFF':'#000000', 0.06);
  return end;
}

function themeFromPalette(id,name,pal,opt){
  opt=opt||{};
  const s=pal.slice().sort((a,b)=>lum(a)-lum(b));
  const acc=hx(opt.accent)||accentOf(pal);
  /* a palette may pin its wallpaper instead of taking the palest swatch — the only
     way to keep a bright point colour ON the wallpaper rather than under it */
  const pin  = hx(opt.bg);
  const dark = opt.dark!=null ? opt.dark : (lum(pin||s[3])<0.46);

  /* ---------- chat ---------- */
  const bg   = pin || (dark ? s[0] : s[3]);
  /* fitFill can drag a bubble back toward the wallpaper — separate again afterwards */
  const you  = separate(fitFill(dark ? mix(s[1],'#FFFFFF',0.06) : mix(bg,'#FFFFFF',0.82), 7.2), bg, 1.16);
  const me   = separate(fitFill(acc===bg?mix(acc,dark?'#FFFFFF':'#000000',0.18):acc, 4.85), bg, 1.22);
  const bar  = dark ? mix(s[0],s[1],0.62) : mix(bg,'#FFFFFF',0.52);
  const ink  = dark ? '#F2F4F7' : '#16181C';
  const chat={
    bgType:'solid', bg1:bg, bg2:autoGrad(bg,me,dark), bg2auto:true, bgAngle:160, bgImg:'', bgDim:0,
    barBg:fitFill(bar,6.2), barText:ensure(dark?ink:s[0],fitFill(bar,6.2),6), barLine:!dark,
    meBg:me,  meText:ensure(readable(me),me,4.6),
    youBg:you, youText:ensure(readable(you),you,7),
    nameCol:ensure(dark?mix(ink,bg,0.25):mix(s[0],bg,0.12),bg,3.6),
    timeCol:ensure(mix(readable(bg),bg,0.42),bg,2.6),
    dateBg:fitFill(dark?mix(bg,'#FFFFFF',0.13):mix(bg,s[0],0.28),4.6),
    dateText:'', misBg:fitFill(acc,5.2), misText:'',
    radius:opt.radius||16, fontSize:15, nameSize:12.5, timeSize:10.5, barSize:16.5,
    tail:opt.tail!==false, avatar:true, avatarText:true, avatarR:14, avatarSize:38,
    showInput:true, inputBg: dark?mix(bg,'#FFFFFF',0.09):mix(bar,'#FFFFFF',0.6),
    showHome:true, statusDark:!dark, showRead:true, readLabel:'읽음', readCol:ensure(acc,bg,2.4)
  };
  chat.dateText=ensure(readable(chat.dateBg),chat.dateBg,5);
  chat.misText=ensure(readable(chat.misBg),chat.misBg,5);

  /* ---------- memo ---------- */
  /* Light memo themes read as dead when the page is white and the card is greyed to
     separate from it. Tint the PAGE with a mid palette colour and keep the card the
     lightest thing on screen instead. */
  let mbg, card;
  if(dark){
    mbg  = mix(s[0],'#000000',0.25);
    card = fitFill(mix(s[0],'#FFFFFF',0.075), 9);
  }else{
    /* tint from the most colourful mid-tone, not just the palest swatch — unless the
       palette pins one, which is how a theme keeps its main hue on the memo page while
       a punchier colour stays the accent */
    let tint=hx(opt.memoTint)||s[2];
    if(!opt.memoTint){
      if(chroma(s[1])>chroma(tint)*1.2) tint=s[1];
      if(chroma(s[3])>chroma(tint)*1.2) tint=s[3];
    }
    mbg = capLum(paperTint(tint,0.105,0.90),0.90);
    /* a pinned tint carries the card too, so the page and the note read as one
       material and the punchy colour stays reserved for the accent */
    card = mix(opt.memoTint?tint:s[3],'#FFFFFF',0.84);
    let guard=0;
    while(lum(card)-lum(mbg)<0.09 && guard++<20) card=mix(card,'#FFFFFF',0.2);
    card = fitFill(card, 9);
  }
  const mtitle=ensure(dark?'#F4F6F8':s[0],card,9);
  const memo={
    bgType:'solid', bg1:mbg, bg2:autoGrad(mbg,acc,dark), bg2auto:true, bgAngle:160, bgImg:'', bgDim:0,
    barBg:fitFill(mbg,7.2), barText:ensure(mtitle,fitFill(mbg,7.2),7), barLine:true,
    cardBg:card, titleCol:ensure(mtitle,card,6.4), bodyCol:ensure(mix(mtitle,card,0.22),card,4.8),
    subCol:ensure(mix(mtitle,card,0.46),card,3.3),
    accent:vividOn(acc,card,2.6,dark), tagBg:fitFill(mix(card,vivid(acc,dark),dark?0.32:0.30),5.2), tagText:'',
    radius:14, fontSize:15, titleSize:22, listTitleSize:13, subSize:10.5, bigSize:31, barSize:16.5,
    paper:'none', statusDark:!dark, showSearch:true, showHome:true
  };
  memo.tagText=ensure(readable(memo.tagBg),memo.tagBg,4.6);

  return { id:id, name:name, pal:pal.slice(), chat:chat, memo:memo };
}

function monoTheme(id,name,h,sat,lit){
  const acc=fromHsl(h, sat==null?0.86:sat, lit==null?0.52:lit);
  return themeFromPalette(id,name,[
    fromHsl(h,0.50,0.21), acc, fromHsl(h,0.70,0.80), fromHsl(h,0.72,0.955)
  ],{accent:acc});
}

/* ============================================================
   COLOUR MIXER
   Pick 1–3 colours; the mixer shuffles which colour plays which ROLE rather than
   inventing new colours, so your picks never disappear. Every derived value still
   goes through ensure()/fitFill()/separate(), so no shuffle can land on a
   combination you cannot read.
   ============================================================ */
/* ============================================================
   COLOUR MIXER
   The mixer no longer invents a theme out of thin air. It takes the theme that is
   already on screen, reads the three colours that give it its identity (bubble ·
   wallpaper · accent) and swaps the chosen colours in for them.

   Every surface keeps its own LIGHTNESS through the swap. That is what preserves the
   arrangement: what was light stays light, what was dark stays dark, so the layering
   and every contrast relationship survive and only the hue changes.
   ============================================================ */
const MIX_DEF={ c1:'', c2:'', c3:'', on2:true, on3:true,
                paper:0, order:[0,1,2], seed:null, base:null, baseId:'' };

/* the three colours the role strip names, pulled out of any theme */
function themeSeed(th){
  const c=(th&&th.chat)||{}, m=(th&&th.memo)||{};
  return [ hx(c.meBg)||'#8A8A8E', hx(c.bg1)||'#FFFFFF',
           hx(m.accent)||hx(c.misBg)||hx(c.youBg)||'#8A8A8E' ];
}
function seedMixer(th,id){
  const seed=themeSeed(th);
  return { c1:seed[0], c2:seed[1], c3:seed[2], on2:true, on3:true,
           paper:0, order:[0,1,2], seed:seed, baseId:id||'',
           base:{ chat:deep(th.chat||{}), memo:deep(th.memo||{}) } };
}
function mixUsable(m){
  return !!(m && m.base && m.base.chat && Array.isArray(m.seed) && m.seed.length===3);
}
/* order[slot] = which chosen colour lands on that slot; a colour switched off leaves
   the slot on the theme's own colour */
function mixTargets(m){
  const seed=(m.seed&&m.seed.length===3)?m.seed:['#8A8A8E','#FFFFFF','#8A8A8E'];
  const ord=(Array.isArray(m.order)&&m.order.length===3)?m.order:[0,1,2];
  const on=[true, m.on2!==false, m.on3!==false];
  const pick=[m.c1,m.c2,m.c3];
  return [0,1,2].map(function(slot){
    const i=ord[slot];
    if(i==null || !on[i]) return seed[slot];
    return hx(pick[i]) || seed[slot];
  });
}
function mixColors(m){ return mixTargets(m); }
/* Fisher–Yates, retried until the order actually changes — a shuffle button that
   sometimes does nothing reads as broken */
function shuffleMix(m,rnd){
  rnd=rnd||Math.random;
  const prev=((Array.isArray(m.order)&&m.order.length===3)?m.order:[0,1,2]).join('|');
  const sh=[0,1,2];
  for(let a=0;a<12;a++){
    for(let i=sh.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=sh[i]; sh[i]=sh[j]; sh[j]=t; }
    if(sh.join('|')!==prev) break;
  }
  return sh.join('|')===prev ? null : sh;
}

/* the most legible highlight on this background; give up rather than ship a faint one */
function bestAccent(bg,base,cands){
  let best=null,bs=-1;
  cands.forEach(function(c){
    if(base && c.toUpperCase()===String(base).toUpperCase()) return;
    const sc=contrast(c,bg);
    if(sc>bs){ bs=sc; best=c; }
  });
  if(best && bs<3 && base) return base;
  return best||cands[0]||'#111111';
}
/* A fill has two jobs at once: stand apart from what is behind it, AND be extreme
   enough that black or white text sits on it legibly. */
function settleFill(c,bg,minSep,minTxt,prefer){
  const ok=function(x){
    return contrast(x,bg)>=minSep &&
           Math.max(contrast(x,'#FFFFFF'),contrast(x,'#0A0B0D'))>=minTxt;
  };
  const base=hx(c)||'#888888';
  if(ok(base)) return base;
  const dirs = prefer==='light' ? ['#FFFFFF'] : prefer==='dark' ? ['#0A0B0D'] : ['#FFFFFF','#0A0B0D'];
  let best=null, bestSteps=999;
  dirs.forEach(function(dir){
    let x=base;
    for(let i=1;i<=48;i++){
      x=mix(x,dir,0.05);
      if(ok(x)){ if(i<bestSteps){ bestSteps=i; best=x; } break; }
    }
  });
  return best || (lum(bg)>0.5 ? '#0A0B0D' : '#FFFFFF');
}

/* Separate a fill from its background by walking its LIGHTNESS only, so hue and
   saturation come through untouched and the colour never drifts. It keeps the side
   of the background it already sits on; when that side runs out of room — a nearly
   white wallpaper has nothing lighter left — it flips to the other side instead of
   snapping to black. */
function holdApart(fill,bg,minSep,minTxt){
  const c=hx(fill)||'#888888', H=hsl(c);
  const ok=function(x){
    return contrast(x,bg)>=minSep &&
           (!minTxt || Math.max(contrast(x,'#FFFFFF'),contrast(x,'#0A0B0D'))>=minTxt);
  };
  if(ok(c)) return c;
  let side = hsl(bg)[2] <= H[2] ? 1 : -1;
  for(let pass=0;pass<2;pass++){
    for(let i=1;i<=70;i++){
      const x=fromHsl(H[0],H[1],clamp(H[2]+side*i*0.012,0,1));
      if(ok(x)) return x;
    }
    side=-side;
  }
  return settleFill(c,bg,minSep,minTxt,null);
}

/* Drive a colour to a target relative luminance by moving its HSL lightness only.
   Binary search, because luminance is neither linear in lightness nor the same across
   hues — and driving luminance directly is what makes the tone lever strictly
   monotonic instead of wobbling by a thousandth every few steps. */
function setLum(c,want){
  const H=hsl(hx(c)||'#FFFFFF');
  let lo=0, hi=1;
  for(let i=0;i<24;i++){
    const mid=(lo+hi)/2;
    if(lum(fromHsl(H[0],H[1],mid))<want) lo=mid; else hi=mid;
  }
  return fromHsl(H[0],H[1],(lo+hi)/2);
}

function hueGap(a,b){ const d=Math.abs(((a-b)%360+360)%360); return d>180?360-d:d; }

/* Map one colour of the base theme onto the chosen one. Lightness is carried over
   exactly — that is the whole trick. */
function recolorOne(c,seed,tgt){
  const x=hx(c); if(!x) return c;
  if(chroma(x)<0.05) return x;                    /* paper, ink, greys: structure, not colour */
  const H=hsl(x);
  let bi=-1, bd=1e9;
  for(let i=0;i<3;i++){
    if(chroma(seed[i])<0.05) continue;
    const d=hueGap(H[0],hsl(seed[i])[0]);
    if(d<bd){ bd=d; bi=i; }
  }
  if(bi<0) return x;                              /* the theme had no colour to map from */
  if(seed[bi].toUpperCase()===tgt[bi].toUpperCase()) return x;
  if(chroma(tgt[bi])<0.05) return fromHsl(H[0],H[1]*0.10,H[2]);   /* swapped for a grey */
  const s=hsl(seed[bi]), t=hsl(tgt[bi]);
  return fromHsl(t[0]+(H[0]-s[0])*0.45,            /* keeps part of its own spread */
                 clamp(H[1]+(t[1]-s[1])*0.75,0,1),
                 H[2]);                            /* lightness untouched */
}
function recolorTheme(base,seed,tgt){
  const out={ chat:deep(base.chat||{}), memo:deep(base.memo||{}) };
  ['chat','memo'].forEach(function(half){
    const o=out[half];
    Object.keys(o).forEach(function(k){
      if(typeof o[k]==='string' && /^#[0-9a-f]{6}$/i.test(o[k])) o[k]=recolorOne(o[k],seed,tgt);
    });
  });
  return out;
}

/* Surfaces that ride along with the wallpaper's tone: [key, min separation, min text] */
const TONE_SURF={
  chat:[['meBg',1.18,4.85],['youBg',1.12,7.0],['barBg',0,6.2],['dateBg',0,4.6],['inputBg',0,0]],
  memo:[['cardBg',1.09,9],['barBg',0,7.2],['tagBg',0,5.2]]
};
/* One lever, one axis. The wallpaper's tone slides toward paper-white and every
   surface moves with it by the same amount, so the gaps that define the layout are
   carried along rather than re-derived. */
function toneTheme(th,paper){
  const k=clamp((paper||0)/100,0,1);
  if(k<=0) return th;
  ['chat','memo'].forEach(function(half){
    const o=th[half]; if(!o || !o.bg1) return;
    const bg0=hx(o.bg1)||'#FFFFFF', H=hsl(bg0);
    /* aim at a luminance, not a lightness, so every step of the slider lands paler
       than the one before it whatever the hue */
    const bg1=setLum(fromHsl(H[0],H[1]*(1-0.5*k),H[2]), lum(bg0)+(0.955-lum(bg0))*k);
    const dL=hsl(bg1)[2]-H[2];
    TONE_SURF[half].forEach(function(p){
      const c=hx(o[p[0]]); if(!c) return;
      const G=hsl(c);
      o[p[0]]=fromHsl(G[0],G[1],clamp(G[2]+dL,0,1));   /* carried along by the same step */
    });
    o.bg1=bg1;
    TONE_SURF[half].forEach(function(p){
      if(p[1]>0) o[p[0]]=holdApart(o[p[0]],o.bg1,p[1],p[2]);
    });
  });
  return th;
}

/* Guarantee legibility without throwing the theme's own colours away. Two rules:
   each colour is only pushed as far as the ratio actually needs, and a colour the
   swap never moved is left strictly alone — a hand-tuned theme has already been
   vetted, and re-deriving it here would quietly redraw a theme the user only looked
   at. So an untouched mixer reproduces its theme byte for byte. */
function repairTheme(th,base){
  const c=th.chat, m=th.memo;
  const moved={};
  if(base){
    ['chat','memo'].forEach(function(half){
      Object.keys(th[half]||{}).forEach(function(k){
        moved[half+'.'+k] = th[half][k]!==(base[half]||{})[k];
      });
    });
  }
  const touched=function(half,keys){
    if(!base) return true;
    return keys.some(function(k){ return moved[half+'.'+k]; });
  };
  if(c){
    if(touched('chat',['meBg','bg1']))     c.meBg  = holdApart(c.meBg, c.bg1, 1.16, 4.85);
    if(touched('chat',['youBg','bg1']))    c.youBg = holdApart(c.youBg, c.bg1, 1.12, 7.0);
    if(touched('chat',['barBg']))          c.barBg = fitFill(c.barBg, 6.2);
    if(touched('chat',['dateBg']))         c.dateBg= fitFill(c.dateBg, 4.6);
    if(touched('chat',['misBg']))          c.misBg = fitFill(c.misBg, 5.2);
    if(touched('chat',['meText','meBg']))    c.meText  = ensure(c.meText, c.meBg, 4.6);
    if(touched('chat',['youText','youBg']))  c.youText = ensure(c.youText, c.youBg, 7);
    if(touched('chat',['barText','barBg']))  c.barText = ensure(c.barText, c.barBg, 6);
    if(touched('chat',['dateText','dateBg']))c.dateText= ensure(c.dateText, c.dateBg, 5);
    if(touched('chat',['misText','misBg']))  c.misText = ensure(c.misText, c.misBg, 5);
    if(touched('chat',['nameCol','bg1']))    c.nameCol = ensure(c.nameCol, c.bg1, 3.4);
    if(touched('chat',['timeCol','bg1']))    c.timeCol = ensure(c.timeCol, c.bg1, 2.6);
    if(touched('chat',['readCol','bg1']))    c.readCol = ensure(c.readCol, c.bg1, 2.6);
  }
  if(m){
    if(touched('memo',['cardBg','bg1'])) m.cardBg = holdApart(m.cardBg, m.bg1, 1.06, 9);
    if(touched('memo',['barBg']))        m.barBg  = fitFill(m.barBg, 7.2);
    if(touched('memo',['tagBg']))        m.tagBg  = fitFill(m.tagBg, 5.2);
    if(touched('memo',['titleCol','cardBg'])) m.titleCol= ensure(m.titleCol, m.cardBg, 6.4);
    if(touched('memo',['bodyCol','cardBg']))  m.bodyCol = ensure(m.bodyCol, m.cardBg, 4.8);
    if(touched('memo',['subCol','cardBg']))   m.subCol  = ensure(m.subCol, m.cardBg, 3.3);
    if(touched('memo',['barText','barBg']))   m.barText = ensure(m.barText, m.barBg, 7);
    if(touched('memo',['tagText','tagBg']))   m.tagText = ensure(m.tagText, m.tagBg, 4.6);
    if(touched('memo',['accent','cardBg']))   m.accent  = ensure(m.accent, m.cardBg, 2.6);
  }
  return th;
}

function mixerTheme(m){
  m=Object.assign({},MIX_DEF,m||{});
  const base = mixUsable(m) ? m.base : { chat:deep(CHAT_DEF), memo:deep(MEMO_DEF) };
  const seed = mixUsable(m) ? m.seed : themeSeed(base);
  const out  = recolorTheme(base, seed, mixTargets(m));
  toneTheme(out, m.paper);
  repairTheme(out, base);
  if(out.chat.bg2auto!==false && out.chat.bg1!==base.chat.bg1)
    out.chat.bg2=autoGrad(out.chat.bg1,out.chat.meBg,lum(out.chat.bg1)<0.42);
  if(out.memo.bg2auto!==false && out.memo.bg1!==base.memo.bg1)
    out.memo.bg2=autoGrad(out.memo.bg1,out.memo.accent,lum(out.memo.bg1)<0.42);
  return { chat:Object.assign(deep(CHAT_DEF),out.chat), memo:Object.assign(deep(MEMO_DEF),out.memo) };
}

function buildThemes(){
  const out=[];
  HAND.forEach(function(h){
    const t=themeFromPalette(h.id,h.name,h.pal,{});
    t.chat=Object.assign({},CHAT_DEF,t.chat,h.chat);
    t.memo=Object.assign({},MEMO_DEF,t.memo,h.memo);
    t.pal=h.pal.slice(); t.grp='기본';
    out.push(t);
  });
  MONO.forEach(function(m){ const t=monoTheme('mono-'+m[0],m[1],m[2],m[3],m[4]); t.grp='단색'; out.push(t); });
  SHOT_PAL.forEach(function(p){ const t=themeFromPalette('sh-'+p[0],p[1],p[2],{}); t.grp='팔레트'; out.push(t); });
  DUO_PAL.forEach(function(p){ const t=themeFromPalette('duo-'+p[0],p[1],p[2],p[3]||{}); t.grp='2색'; out.push(t); });
  out.forEach(function(t){
    t.chat=Object.assign({},CHAT_DEF,t.chat);
    t.memo=Object.assign({},MEMO_DEF,t.memo);
    /* every theme ships with a gradient that is already correct for it */
    const cd=lum(t.chat.bg1)<0.42, md=lum(t.memo.bg1)<0.42;
    t.chat.bg2=autoGrad(t.chat.bg1,t.chat.meBg,cd); t.chat.bg2auto=true;
    t.memo.bg2=autoGrad(t.memo.bg1,t.memo.accent,md); t.memo.bg2auto=true;
  });
  return out;
}
const THEMES=buildThemes();
function findTheme(id){
  for(let i=0;i<THEMES.length;i++) if(THEMES[i].id===id) return THEMES[i];
  for(let i=0;i<S.custom.length;i++) if(S.custom[i].id===id) return S.custom[i];
  return null;
}

/* ---- background css ---- */
function bgCss(t){
  if(t.bgType==='grad') return 'linear-gradient('+(t.bgAngle||160)+'deg,'+t.bg1+' 0%,'+t.bg2+' 100%)';
  return t.bg1;
}

};

function snap(){
  return {
    v:4, mode:S.mode, ui:S.ui, raw:S.raw,
    chat:{units:S.chat.units, rooms:S.chat.rooms, room:S.chat.room, me:S.chat.me,
          roomName:S.chat.roomName, dateLine:S.chat.dateLine},
    memo:S.memo, range:S.range, theme:S.theme, themeId:S.themeId, custom:S.custom,
    avatars:S.avatars, pages:S.pages, scale:S.scale, fileName:S.fileName,
    statusBar:S.statusBar, statusTime:S.statusTime,
    panelW:S.panelW, stageH:S.stageH, thFold:S.thFold, mixFold:S.mixFold, thFilter:S.thFilter,
    mixer:S.mixer, at:Date.now()
  };
}
let lastSave=0, saveFail=false;
const save=debounce(function(){
  try{
    localStorage.setItem(LSK, JSON.stringify(snap()));
    lastSave=Date.now(); saveFail=false;
  }catch(e){
    saveFail=true;
    try{ const s=snap(); s.avatars={}; s.theme.chat.bgImg=''; s.theme.memo.bgImg='';
         localStorage.setItem(LSK, JSON.stringify(s)); }catch(e2){}
  }
  paintSaveStat();
},420);

function load(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(LSK)||'null'); }catch(e){}
  if(!d||d.v!==3) return false;
  try{
    S.mode=d.mode==='memo'?'memo':'chat';
    S.ui=d.ui||'light';
    S.raw=Object.assign({chat:'',memo:''},d.raw);
    S.chat=Object.assign(S.chat,d.chat||{});
    S.memo=Object.assign(S.memo,d.memo||{});
    S.range=Object.assign({chat:[1,1],memo:[1,1]},d.range);
    S.theme={chat:Object.assign(deep(CHAT_DEF),(d.theme||{}).chat||{}),
             memo:Object.assign(deep(MEMO_DEF),(d.theme||{}).memo||{})};
    S.themeId=d.themeId||'kakao';
    S.custom=Array.isArray(d.custom)?d.custom:[];
    /* v4 shrank the memo HOME's entry text to 0.85 — the two size fields only the
       home uses. A profile saved before that carries the old sizes, so scale them
       once here. Multiplied rather than overwritten, so a size the user tuned
       themselves keeps its proportion; every other memo size is left alone. */
    if((d.v||0)<4){
      const shrink=function(m){
        if(!m) return;
        ['listTitleSize','subSize'].forEach(function(k){
          if(typeof m[k]==='number' && m[k]>0) m[k]=Math.round(m[k]*0.85*2)/2;
        });
      };
      shrink(S.theme.memo);
      S.custom.forEach(function(t){ shrink(t&&t.memo); });
    }
    S.avatars=d.avatars||{};
    S.pages=Object.assign({chat:1,memo:1},d.pages);
    S.scale=d.scale||2;
    S.fileName=Object.assign({chat:'',memo:''},d.fileName);
    S.statusBar=d.statusBar!==false;
    S.statusTime=d.statusTime||'11:34';
    S.panelW=d.panelW||428; S.stageH=d.stageH||0; S.thFold=!!d.thFold; S.mixFold=!!d.mixFold;
    S.thFilter=d.thFilter||'기본'; S.mixer=d.mixer||null;
    lastSave=d.at||0;
    return !!(S.raw.chat||S.raw.memo);
  }catch(e){ return false; }
}
function paintSaveStat(){
  const n=$('#saveStat'); if(!n) return;
  if(saveFail){ n.className='stat warn'; n.innerHTML=ico('warn',16)+'<span>저장 공간이 부족합니다. 배경·프로필 이미지는 저장되지 않았어요.</span>'; return; }
  const t=lastSave?new Date(lastSave):null;
  const hm=t?('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2):'—';
  n.className='stat ok'; n.innerHTML=ico('check',16)+'<span>자동 저장됨 · 마지막 '+hm+'</span>';
}

/* ---------- convenience ---------- */
function T(){ return S.theme[S.mode]; }
function curRaw(){ return S.raw[S.mode]; }
function curRange(){ return S.range[S.mode]; }

/* units currently eligible (after room filter) */
function roomUnits(){
  if(!S.chat.units.length) return [];
  if(S.chat.rooms.length<=1) return S.chat.units;
  if(S.chat.roomMode!=='one') return S.chat.units;   /* split / group use everything */
  return S.chat.units.filter(u=>u.room===S.chat.room);
}
/* rooms that actually have visible messages, in first-appearance order */
function liveRooms(){
  const seen={}, out=[];
  liveList().forEach(function(u){ if(!seen[u.room]){ seen[u.room]=1; out.push(u.room); } });
  return out;
}
function sortedNotes(){
  const a=S.memo.notes.slice();
  if(S.memo.sort==='desc') a.sort((x,y)=>y.ord-x.ord);
  else if(S.memo.sort==='asc') a.sort((x,y)=>x.ord-y.ord);
  return a;
}
/* the list the range slider + checkboxes work on */
function baseList(){ return S.mode==='chat' ? roomUnits() : sortedNotes(); }
/* what actually gets drawn */
function liveList(){
  const b=baseList(), r=curRange();
  const a=clamp(r[0],1,Math.max(1,b.length)), z=clamp(r[1],1,Math.max(1,b.length));
  return b.slice(a-1,z).filter(u=>u.on!==false);
}

/* ---------- avatar colour from name ---------- */
function nameHue(n){
  let h=0; const s=String(n||'');
  for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  return h%360;
}
/* The default follows the theme: take the theme's own identity colour and fan the
   cast out around its hue, so a room's avatars read as part of the palette instead of
   a random rainbow. A colour the user picked by hand always wins over this. */
function themeAvatarCol(name){
  const t=(S.theme&&S.theme.chat)||{};
  const base=hx(t.meBg)||hx(t.bg1)||'#8A8A8E';
  const H=hsl(base);
  const k=nameHue(name)/360;                       /* stable 0..1 per name */
  const dark=lum(hx(t.bg1)||'#FFFFFF')<0.42;
  return fromHsl(H[0]+(k*2-1)*24,
                 clamp(H[1]*0.86+0.10,0.20,0.78),
                 dark ? clamp(0.46+k*0.16,0.40,0.66) : clamp(0.36+k*0.16,0.30,0.56));
}
function avatarFor(name){
  const a=S.avatars[name]||{};
  const col=a.col||themeAvatarCol(name);
  return { img:a.img||'', col:col, ini:(String(name||'?').trim()[0]||'?'),
           txt:ensure(readable(col),col,4.5), custom:!!a.col };
}
function participants(){
  const set={}, out=[];
  S.chat.units.forEach(function(u){
    const all=[u.who].concat(u.tos&&u.tos.length?u.tos:[u.to]);
    all.forEach(function(n){ if(n&&!set[n]){set[n]=1;out.push(n);} });
  });
  return out;
}
/* how many people are in the current room — caps the unread count */
function roomMembers(ri){
  if(S.chat.roomMode==='group') return Math.max(2,participants().length);
  const r=S.chat.rooms[ri==null?S.chat.room:ri];
  return r&&r.names ? Math.max(2,r.names.length) : 2;
}
function isGroupRoom(){ return roomMembers()>2; }
function roomPartner(ri){
  if(S.chat.roomMode==='group'){
    const o=participants().filter(n=>n!==S.chat.me);
    return o.join(', ');
  }
  const r=S.chat.rooms[ri==null?S.chat.room:ri];
  if(!r) return '';
  const o=r.names.filter(n=>n!==S.chat.me);
  return o.length?o.join(', '):r.names[0];
}
/* a chat "cell" = one < 보낸사람 … > block. Pages are cut on these, never mid-cell. */
function chatCells(items){
  const cells=[]; let cur=null;
  items.forEach(function(u,i){
    const mine=u.who===S.chat.me;
    if(!cur || cur.gi!==u.gi || cur.mine!==mine){ cur={gi:u.gi,mine:mine,id:u.id,a:i,b:i+1}; cells.push(cur); }
    else cur.b=i+1;
  });
  return cells;
}
function chatMaxPages(){
  if(S.mode!=='chat') return 1;
  if(S.chat.roomMode==='split') return Math.max(1,liveRooms().length);
  return Math.max(1,chatCells(liveList()).length);
}

/* ============================================================
   PREVIEW RENDERERS
   Every node below is plain DOM with inline colours — no
   pseudo-elements — so the PNG exporter can clone it verbatim.
   ============================================================ */

function svgTag(w,h,cls,inner){
  const n=document.createElementNS('http://www.w3.org/2000/svg','svg');
  n.setAttribute('width',w); n.setAttribute('height',h);
  n.setAttribute('viewBox','0 0 '+w+' '+h); n.setAttribute('fill','none');
  if(cls) n.setAttribute('class',cls);
  n.innerHTML=inner;
  return n;
}
function lineIco(name,size,col,sw){
  const n=svgTag(24,24,'',ICO[name]||'');
  n.setAttribute('width',size); n.setAttribute('height',size);
  n.setAttribute('stroke',col); n.setAttribute('stroke-width',sw||1.9);
  n.setAttribute('stroke-linecap','round'); n.setAttribute('stroke-linejoin','round');
  n.style.flex='0 0 auto';
  return n;
}

/* ---------- shell: background + status bar + top bar ---------- */
function pvShell(t,h){
  const pv=el('div','pv');
  pv.style.width=PV_W+'px';
  if(h) pv.style.minHeight=h+'px';

  const bg=el('div','pv-bg');

  if(t.bgType==='img'&&t.bgImg){
    const im=el('div','pv-bg-img'); im.style.backgroundImage='url("'+t.bgImg+'")'; pv.appendChild(im);
    if(t.bgDim>0){ const d=el('div','pv-bg-dim'); d.style.background='rgba(0,0,0,'+(t.bgDim/100)+')'; pv.appendChild(d); }
  }
  const layer=el('div','pv-layer');
  pv.appendChild(layer);
  return {pv:pv, layer:layer};
}

  r.appendChild(svgTag(16,12,'', '<path d="M8 10.6 4.2 6.9a5.4 5.4 0 0 1 7.6 0L8 10.6Z" fill="'+col+'"/><path d="M1.6 4.4a9.1 9.1 0 0 1 12.8 0" stroke="'+col+'" stroke-width="1.5" fill="none" stroke-linecap="round"/>'));
  r.appendChild(svgTag(25,12,'', '<rect x="0.6" y="0.6" width="20" height="10.8" rx="3" stroke="'+col+'" stroke-opacity=".42" fill="none"/><rect x="2.3" y="2.3" width="16.6" height="7.4" rx="1.8" fill="'+col+'"/><path d="M22.4 4.3v3.4a2 2 0 0 0 0-3.4Z" fill="'+col+'" fill-opacity=".45"/>'));

function topBar(t,opt){

/* ============================================================
   CHAT
   ============================================================ */
/* A triangle with straight edges and one rounded vertex (the tip).
   Box 14 x 22, wall at x=10, bubble's bottom line at y=18.
     M14 6.1          top vertex, buried inside the bubble
     L4.86 15.82      STRAIGHT hypotenuse
     Q2.8 18 5.8 18   the tip vertex rounded — the quadratic's control point IS the
                      true vertex, so it leaves the hypotenuse and meets the bottom
                      line tangentially: no kink at either end
     L5.8 21 L14 21   carry the fill below the clip line so the wrapper's rectangle
                      cuts the bottom edge, not the path's own antialiasing
   The clip box is the bubble's box, which is why the underside lands on exactly the
   same pixel row as the bubble's background at any device ratio. */
function tailSvg(dir,col){
  const p = dir==='you'
    ? 'M14 6.1 L4.86 15.82 Q2.8 18 5.8 18 L5.8 21 L14 21 Z'
    : 'M0 6.1 L9.14 15.82 Q11.2 18 8.2 18 L8.2 21 L0 21 Z';
  return svgTag(14,22,'cv-tail','<path d="'+p+'" fill="'+col+'"/>');
}
function avatarNode(name,t){
  const a=avatarFor(name);
  const n=el('div','cv-av');
  const sz=t.avatarSize||38;
  n.style.width=sz+'px'; n.style.height=sz+'px'; n.style.fontSize=Math.round(sz*0.4)+'px';
  n.style.borderRadius=(t.avatarR>=50?'50%':t.avatarR+'px');
  if(a.img){ n.style.backgroundImage='url("'+a.img+'")'; }
  else {
    n.style.background=a.col;
    if(t.avatarText!==false){ n.textContent=a.ini; n.style.color=a.txt; }
  }
  return n;
}

function renderChatPage(units,opt){
  opt=opt||{};
  const t=S.theme.chat;
  const sh=pvShell(t,opt.minH);
  const L=sh.layer;
  if(S.statusBar) L.appendChild(statusBar(t));
  if(opt.bar!==false){
    const ri = opt.room==null ? S.chat.room : opt.room;
    const mem = roomMembers(ri);
    const title = opt.title || S.chat.roomName || roomPartner(ri) || '대화';
    L.appendChild(topBar(t,{ title:title, n: mem>2?mem:0, icons:['search','menu'] }));
  }
  const body=el('div','pv-body');
  body.style.fontSize=t.fontSize+'px';
  L.appendChild(body);

  if(opt.dateLine && S.chat.dateLine){
    const d=el('div','cv-date'); const s=el('span',null,S.chat.dateLine);
    s.style.background=t.dateBg; s.style.color=t.dateText;
    s.style.fontSize=Math.max(9,(t.fontSize||15)-3.5)+'px';
    d.appendChild(s); body.appendChild(d);
  }

  let lastGi=-1, lastRow=null, lastCol=null, lastMeLine=null;
  units.forEach(function(u,idx){
    const mine = u.who===S.chat.me;
    const sameGroup = (u.gi===lastGi) && lastRow && (lastRow.dataset.mine===String(mine));
    let col;
    if(sameGroup){
      col=lastCol;
    }else{
      const row=el('div','cv-row '+(mine?'me':'you'));
      row.dataset.mine=String(mine);
      row.dataset.u=u.id;
      if(t.avatar && !mine) row.appendChild(avatarNode(u.who,t));
      col=el('div','cv-col');
      if(!mine){
        const nm=el('div','cv-name',u.who);
        nm.style.color=t.nameCol; nm.style.fontSize=(t.nameSize||12.5)+'px';
        col.appendChild(nm);
      }
      row.appendChild(col);
      body.appendChild(row);
      lastRow=row; lastCol=col; lastGi=u.gi;
    }

    if(u.mis){
      const w=el('div','cv-mis');
      w.style.background=t.misBg; w.style.color=t.misText;
      w.appendChild(lineIco('warn',11,t.misText,2.2));
      w.appendChild(el('span',null,'원래 '+u.mis+'에게 보내려던 메시지'));
      col.appendChild(w);
    }

    const line=el('div','cv-line');
    line.dataset.u=u.id;
    const bub=el('div','cv-bub rt');
    bub.style.background = mine?t.meBg:t.youBg;
    bub.style.color      = mine?t.meText:t.youText;
    bub.style.borderRadius = t.radius+'px';
    bub.style.fontSize = (t.fontSize||15)+'px';
    bub.innerHTML = richHTML(u.text);
    let bubHost=bub;

    const nxt=units[idx+1];
    const isLast = !nxt || nxt.gi!==u.gi || (nxt.who===S.chat.me)!==mine;

    if(t.tail && isLast){
      /* flatten the corner the tail meets so the bubble edge is straight there */
      const flat=Math.min(3,t.radius)+'px';
      if(mine) bub.style.borderBottomRightRadius=flat; else bub.style.borderBottomLeftRadius=flat;
      bub.appendChild(tailSvg(mine?'me':'you', mine?t.meBg:t.youBg));
      const tw=el('div','cv-tw '+(mine?'me':'you'));
      tw.appendChild(bub);
      bubHost=tw;
    }
    line.appendChild(bubHost);

    if(isLast){
      const meta=el('div','cv-meta');
      meta.style.color=t.timeCol; meta.style.fontSize=(t.timeSize||10.5)+'px';
      const un=+u.unread||0;
      if(mine && un>0){ const r=el('div','cv-read',String(un)); r.style.color=t.readCol; meta.appendChild(r); }
      meta.appendChild(el('div',null,u.time||''));
      line.appendChild(meta);
    }
    if(mine) lastMeLine=line;
    col.appendChild(line);
  });

  if(t.showRead && t.readLabel && lastMeLine && lastMeLine.parentNode){
    const rl=el('div','cv-readlabel', t.readLabel);
    rl.style.color=t.timeCol; rl.style.fontSize=Math.max(8,(t.timeSize||10.5)-0.5)+'px';
    lastMeLine.parentNode.appendChild(rl);
  }

  if(t.showInput){
    const inp=el('div','cv-input');
    inp.style.background=mix(t.barBg,readable(t.barBg)==='#FFFFFF'?'#000000':'#FFFFFF',0.06);
    const pl=lineIco('plus',21,rgba(readable(t.barBg),0.5),2); inp.appendChild(pl);
    const bx=el('div','ci-box','메시지 입력');
    bx.style.fontSize=Math.max(11,(t.fontSize||15)-1)+'px';
    bx.style.background=t.inputBg; bx.style.color=rgba(readable(t.inputBg),0.34);
    inp.appendChild(bx);
    const sd=el('div','ci-send'); sd.style.background=t.meBg;
    sd.appendChild(lineIco('send',15,t.meText,2)); inp.appendChild(sd);
    L.appendChild(inp);
  }
  if(t.showHome){
    const h=el('div','cv-home'); h.style.background=t.showInput?mix(t.barBg,readable(t.barBg)==='#FFFFFF'?'#000000':'#FFFFFF',0.06):'transparent';
    const i=el('i'); i.style.background=rgba(readable(t.barBg),0.26); h.appendChild(i); L.appendChild(h);
  }
  return sh.pv;
}

/* ============================================================
   MEMO

function memoGroupLabel(n,i,arr){
  if(S.memo.group==='none') return null;
  if(S.memo.group==='month') return n.mo? n.mo+'월' : '기타';
  /* auto: newest = 오늘 */
  const top=arr.reduce((a,b)=>b.ord>a?b.ord:a,0);
  const d=Math.abs(top-n.ord)/1000;
  return d<1?'오늘':d<7?'이번 주':d<31?'이번 달':'이전';
}
function paperCss(t){
  if(t.paper==='ruled') return 'repeating-linear-gradient(to bottom, transparent 0 24px, '+rgba(t.subCol,0.18)+' 24px 25px)';
  if(t.paper==='grid')  return 'repeating-linear-gradient(to bottom, transparent 0 23px, '+rgba(t.subCol,0.13)+' 23px 24px),'+
                               'repeating-linear-gradient(to right, transparent 0 23px, '+rgba(t.subCol,0.13)+' 23px 24px)';
  if(t.paper==='dot')   return 'radial-gradient('+rgba(t.subCol,0.28)+' 1px, transparent 1px)';
  return '';
}
/* the card already prints the first line as the subtitle — don't print it twice */
function bodyAfterSub(note){
  const bl=String(note.body||'').split('\n');
  for(let i=0;i<bl.length;i++){ if(bl[i].trim()!==''){ return bl.slice(i+1).join('\n'); } }
  return '';
}
function memoBodyNode(note,t,limit){
  const wrap=el('div','md-body rt');
  wrap.style.color=t.bodyCol; wrap.style.fontSize=t.fontSize+'px';
  const bl=memoBlocks(note.body);
  const use = limit? bl.slice(0,limit) : bl;
  use.forEach(function(b){
    if(b.k==='gap'){ const g=el('div'); g.style.height='0.62em'; wrap.appendChild(g); return; }
    if(b.k==='li'||b.k==='cb'){
      const li=el('div','md-li');
      if(b.k==='cb'){
        const cb=el('div','md-cb');
        cb.style.background=b.done?t.accent:'transparent';
        cb.style.boxShadow='inset 0 0 0 1.6px '+(b.done?t.accent:rgba(t.subCol,0.6));
        if(b.done) cb.appendChild(lineIco('check',10,readable(t.accent),3));
        li.appendChild(cb);
      }else{
        const bu=el('div','li-b',b.b); bu.style.color=t.accent; li.appendChild(bu);
      }
      const c=el('div','li-c rt'); c.innerHTML=richHTML(b.c); li.appendChild(c);
      wrap.appendChild(li);
      return;
    }
    const p=el('div','rt'); p.innerHTML=richHTML(b.c); wrap.appendChild(p);
  });
  return wrap;
}

/* toggle a card's picked state in place — rebuilding the deck for every tap

function renderMemoHome(notes,opt){
  opt=opt||{};
  const t=S.theme.memo;

/* ============================================================
   CONTROLS
   — slider keeps the thumb exactly where the finger let go
   — text inputs are never rewritten while focused
   ============================================================ */

function makeSlider(node,opt){
  opt=opt||{};
  const dual=!!opt.dual;
  const min=opt.min==null?0:opt.min, max=opt.max==null?100:opt.max;
  const step=opt.step||1;
  const fmt=opt.fmt||(v=>String(v));
  let va = dual ? clamp(opt.value[0],min,max) : clamp(opt.value,min,max);
  let vb = dual ? clamp(opt.value[1],min,max) : 0;
  let dragging=null, api;

  node.innerHTML='';
  node.classList.add('sld'); if(dual) node.classList.add('dual');
  const track=el('div','sld-track'); const fill=el('div','sld-fill');
  track.appendChild(fill); node.appendChild(track);
  if(opt.ticks && (max-min)/step<=26){
    const tk=el('div','sld-ticks');
    for(let i=min;i<=max;i+=step) tk.appendChild(el('i'));
    node.appendChild(tk);
  }
  const thA=el('div','sld-thumb a'); node.appendChild(thA);
  const thB=dual?el('div','sld-thumb b'):null; if(thB) node.appendChild(thB);
  const bub=el('div','sld-bub'); node.appendChild(bub);
  node.setAttribute('tabindex','0');

  function pct(v){ return (max===min)?0:((v-min)/(max-min))*100; }
  function paint(){
    const pa=pct(va), pb=dual?pct(vb):pa;
    thA.style.left='calc(10px + (100% - 20px) * '+(pa/100)+')';
    if(thB) thB.style.left='calc(10px + (100% - 20px) * '+(pb/100)+')';
    if(dual){ const lo=Math.min(pa,pb), hi=Math.max(pa,pb);
      fill.style.left=lo+'%'; fill.style.right=(100-hi)+'%'; }
    else { fill.style.left='0'; fill.style.right=(100-pa)+'%'; }
    const act=(dragging==='b')?pb:pa;
    bub.style.left='calc(10px + (100% - 20px) * '+(act/100)+')';
    bub.textContent=fmt(dragging==='b'?vb:va, dual?[va,vb]:va);
    node.setAttribute('aria-valuenow', dual? (Math.min(va,vb)+'-'+Math.max(va,vb)) : va);
  }
  function fromX(cx){
    const r=track.getBoundingClientRect();
    const p=clamp((cx-r.left)/Math.max(1,r.width),0,1);
    let v=min+p*(max-min);
    v=Math.round(v/step)*step;
    v=clamp(v,min,max);
    return +v.toFixed(6);
  }
  function down(e){
    if(e.button!=null && e.button!==0) return;
    node.setPointerCapture&&node.setPointerCapture(e.pointerId);
    node.classList.add('is-drag');
    const v=fromX(e.clientX);
    if(dual) dragging = Math.abs(v-va)<=Math.abs(v-vb) ? 'a' : 'b';
    else dragging='a';
    if(dragging==='a') va=v; else vb=v;
    paint(); opt.onInput&&opt.onInput(api.value());
    e.preventDefault();
  }
  function move(e){
    if(!dragging) return;
    const v=fromX(e.clientX);
    if(dragging==='a'){ if(v===va) return; va=v; } else { if(v===vb) return; vb=v; }
    paint(); opt.onInput&&opt.onInput(api.value());
    e.preventDefault();
  }
  function up(e){
    if(!dragging) return;
    dragging=null; node.classList.remove('is-drag');
    try{ node.releasePointerCapture&&node.releasePointerCapture(e.pointerId); }catch(_){}
    paint(); opt.onChange&&opt.onChange(api.value());
  }
  on(node,'pointerdown',down);
  on(node,'pointermove',move);
  on(node,'pointerup',up);
  on(node,'pointercancel',up);
  on(node,'lostpointercapture',up);
  on(node,'keydown',function(e){
    const k=e.key; let d=0;
    if(k==='ArrowRight'||k==='ArrowUp') d=step;
    else if(k==='ArrowLeft'||k==='ArrowDown') d=-step;
    else if(k==='Home') d=min-va; else if(k==='End') d=max-va;
    else return;
    e.preventDefault();
    va=clamp(va+d,min,max); paint();
    opt.onInput&&opt.onInput(api.value()); opt.onChange&&opt.onChange(api.value());
  });

  api={
    value(){ return dual?[Math.min(va,vb),Math.max(va,vb)]:va; },
    set(v,silent){
      if(dragging) return;                       /* never fight the finger */
      if(dual){ va=clamp(v[0],min,max); vb=clamp(v[1],min,max); }
      else va=clamp(v,min,max);
      paint(); if(!silent&&opt.onChange) opt.onChange(api.value());
    },
    bounds(nmin,nmax){
      if(dragging) return;
      opt.min=nmin; opt.max=nmax;
      api._min=nmin;
      return;
    },
    dragging(){ return !!dragging; },
    paint:paint
  };
  paint();
  return api;
}

/* rebuild a slider in place when its range changes */
const SLD={};
function slider(sel,opt){
  const node=$(sel); if(!node) return null;
  SLD[sel]=makeSlider(node,opt);
  return SLD[sel];
}

/* ------------------------------------------------------------
   safe text / number input
   ------------------------------------------------------------ */
function bindText(node,get,set,opt){
  if(!node) return;
  opt=opt||{};
  node._get=get;
  const push=()=>{ if(document.activeElement!==node) node.value=get()==null?'':get(); };
  node._sync=push; push();
  const commit=(v,live)=>{ set(v,live); };
  const soft=debounce(function(){ if(document.activeElement===node) commit(node.value,true); }, opt.live===false?100000:520);
  on(node,'input',soft);
  on(node,'change',function(){ commit(node.value,false); });
  on(node,'blur',function(){ commit(node.value,false); raf(()=>push()); });
  on(node,'keydown',function(e){ if(e.key==='Enter'&&node.tagName!=='TEXTAREA'){ e.preventDefault(); node.blur(); } });
}
function bindNum(node,get,set,lo,hi){
  if(!node) return;
  const push=()=>{ if(document.activeElement!==node) node.value=get(); };
  node._sync=push; push();
  on(node,'blur',function(){
    let v=parseInt(String(node.value).replace(/[^\d-]/g,''),10);
    if(isNaN(v)) v=get();
    v=clamp(v,lo(),hi());
    set(v); raf(()=>push());
  });
  on(node,'keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); node.blur(); } });
}
function syncInputs(root){ $$('input,textarea',root||document).forEach(n=>{ if(n._sync) n._sync(); }); }
function syncChoices(root){ $$('[data-choice]',root||document).forEach(n=>{ if(n._sync) n._sync(); }); }
function raf(fn){ return requestAnimationFrame(fn); }

/* ------------------------------------------------------------
   choice groups / switches / colour rows
   ------------------------------------------------------------ */
function bindChoice(name,get,set){
  const box=$('[data-choice="'+name+'"]'); if(!box) return;
  box._sync=function(){
    $$('.choice-b',box).forEach(b=>b.classList.toggle('is-on', String(b.dataset.v)===String(get())));
  };
  $$('.choice-b',box).forEach(function(b){
    on(b,'click',function(){ set(b.dataset.v); box._sync(); });
  });
  box._sync();
}
function switchRow(title,desc,get,set){
  const r=el('label','sw-row');
  const t=el('div','sw-txt');
  t.appendChild(el('div','sw-t',title));
  if(desc) t.appendChild(el('div','sw-d',desc));
  r.appendChild(t);
  const s=el('div','sw'); s.appendChild(el('i')); r.appendChild(s);
  const paint=()=>s.classList.toggle('is-on',!!get());
  paint();
  on(r,'click',function(e){ e.preventDefault(); set(!get()); paint(); });
  r._sync=paint;
  return r;
}
/* ============================================================
   INLINE COLOUR PICKER  (HSV plane + hue strip + hex + swatches)
   Same interaction model as the reference picker, restyled for this app and
   extended with the thing this tool actually cares about: a live contrast
   readout against whatever the colour will sit on.
   ============================================================ */
const CP_QUICK=['#FFFFFF','#F2F3F5','#9AA1AB','#3E444C','#111111',
                '#FF4D4F','#FF7A45','#FFC53D','#73D13D','#36CFC9',
                '#3B82F6','#6E56CF','#C13DBE','#F2668B','#8C6239','#0E7490'];
const CP_OPEN=[];
function cpCloseAll(except){
  CP_OPEN.forEach(function(n){ if(n!==except) n.classList.remove('open'); });
}
on(document,'pointerdown',function(e){
  if(!e.target.closest || !e.target.closest('.cp')) cpCloseAll(null);
});

/* label, get()->hex, set(hex), against()->hex|null (the surface it sits on) */
function colorControl(label,get,set,against,minRatio){
  minRatio=minRatio||4.5;
  const root=el('div','cp');
  CP_OPEN.push(root);

  const trig=el('button','cp-trig');
  const sw=el('span','cp-sw');
  const nm=el('span','cp-name',label);
  const val=el('span','cp-val');
  const warn=el('span','cp-warn'); warn.innerHTML=ico('warn',14);
  const chev=el('span','cp-chev'); chev.innerHTML=ico('chev',13);
  [sw,nm,val,warn,chev].forEach(function(n){ trig.appendChild(n); });
  root.appendChild(trig);

  const pop=el('div','cp-pop');
  const plane=el('div','cp-plane'); const pcur=el('span','cp-pcur'); plane.appendChild(pcur);
  const hue=el('div','cp-hue'); const hcur=el('span','cp-hcur'); hue.appendChild(hcur);
  const row=el('div','cp-row');
  const hexI=document.createElement('input');
  hexI.className='cp-hex'; hexI.maxLength=7; hexI.spellcheck=false; hexI.setAttribute('aria-label',label+' HEX');
  const copy=el('button','cp-copy','복사');
  row.appendChild(hexI); row.appendChild(copy);
  const meta=el('div','cp-meta');
  const rRgb=el('div','cp-read'); rRgb.innerHTML='<small>RGB</small><b></b>';
  const rHsl=el('div','cp-read'); rHsl.innerHTML='<small>HSL</small><b></b>';
  const rCon=el('div','cp-read'); rCon.innerHTML='<small>대비</small><b></b>';
  meta.appendChild(rRgb); meta.appendChild(rHsl);
  if(against) meta.appendChild(rCon);
  const quick=el('div','cp-quick');
  [plane,hue,row,meta,quick].forEach(function(n){ pop.appendChild(n); });
  root.appendChild(pop);

  /* keep the hue the user was on even when saturation drops to zero */
  let hsv={h:270,s:0.8,v:0.8};

  function paint(){
    const v=hx(get())||'#000000';
    const nx=rgbToHsv(v);
    if(nx.s>0.001) hsv.h=nx.h;
    hsv.s=nx.s; hsv.v=nx.v;

    sw.style.background=v;
    val.textContent=v;
    if(document.activeElement!==hexI) hexI.value=v;
    plane.style.background='linear-gradient(to top,#000,transparent),'+
                           'linear-gradient(to right,#fff,hsl('+Math.round(hsv.h)+',100%,50%))';
    pcur.style.left=(hsv.s*100)+'%';
    pcur.style.top=((1-hsv.v)*100)+'%';
    pcur.style.background=v;
    hcur.style.left=((hsv.h/360)*100)+'%';

    const p=rgb(v), hl=hsl(v);
    $('b',rRgb).textContent=p[0]+', '+p[1]+', '+p[2];
    $('b',rHsl).textContent=Math.round(hl[0])+'°, '+Math.round(hl[1]*100)+'%, '+Math.round(hl[2]*100)+'%';
    if(against){
      const bgc=against();
      const c=bgc?contrast(v,bgc):0;
      const ok=c>=minRatio;
      $('b',rCon).textContent=bgc?(c.toFixed(1)+':1'):'—';
      rCon.className='cp-read '+(bgc?(ok?'ok':'bad'):'');
      root.classList.toggle('low', !!bgc && !ok);
      warn.title='대비 '+c.toFixed(1)+':1 — 읽기 어려울 수 있습니다';
    }
    paintQuick();
  }

  function paintQuick(){
    const cur=(hx(get())||'').toUpperCase();
    const roles=[];
    if(S.mixer){
      const m=S.mixer;
      [[m.c1,'테마색'],[m.on2!==false?m.c2:null,'보조 1'],[m.on3!==false?m.c3:null,'보조 2']]
        .forEach(function(r){ const c=hx(r[0]); if(c && !roles.some(function(x){return x.c===c;})) roles.push({c:c,l:r[1]}); });
    }
    const list=roles.concat(
      CP_QUICK.map(function(c){return {c:hx(c),l:''};})
              .filter(function(o){ return !roles.some(function(r){return r.c===o.c;}); })
    ).slice(0,24);
    quick.innerHTML='';
    list.forEach(function(o){
      const b=el('button','cp-q'+(o.l?' role':''));
      b.style.setProperty('--qc',o.c);
      b.title=o.l?(o.l+' · '+o.c):o.c;
      b.setAttribute('aria-label',b.title);
      if(o.c===cur) b.style.outline='2px solid var(--ink)';
      on(b,'click',function(){ commit(o.c); });
      quick.appendChild(b);
    });
  }

  function commit(v,live){
    const c=hx(v); if(!c) return;
    set(c,live); paint();
  }
  function fromPlane(e){
    const r=plane.getBoundingClientRect();
    hsv.s=clamp((e.clientX-r.left)/Math.max(1,r.width),0,1);
    hsv.v=1-clamp((e.clientY-r.top)/Math.max(1,r.height),0,1);
    commit(hsvToHex(hsv),true);
  }
  function fromHue(e){
    const r=hue.getBoundingClientRect();
    hsv.h=clamp((e.clientX-r.left)/Math.max(1,r.width),0,1)*360;
    commit(hsvToHex(hsv),true);
  }
  /* pointer capture so dragging off the surface keeps tracking */
  function surface(node,fn){
    on(node,'pointerdown',function(e){
      e.preventDefault(); node.setPointerCapture&&node.setPointerCapture(e.pointerId); fn(e);
    });
    on(node,'pointermove',function(e){
      if(node.hasPointerCapture&&node.hasPointerCapture(e.pointerId)) fn(e);
    });
    on(node,'pointerup',function(e){
      try{ node.releasePointerCapture&&node.releasePointerCapture(e.pointerId); }catch(_){}
      commit(hsvToHex(hsv),false);
    });
  }
  surface(plane,fromPlane);
  surface(hue,fromHue);

  on(trig,'click',function(e){
    e.preventDefault();
    const opening=!root.classList.contains('open');
    cpCloseAll(root);
    root.classList.toggle('open',opening);
    trig.setAttribute('aria-expanded',String(opening));
    if(opening) paint();
  });
  on(hexI,'change',function(){
    const v=hx(hexI.value);
    if(v) commit(v,false); else { paint(); toast('#RRGGBB 형식으로 입력해 주세요','warn'); }
  });
  on(hexI,'keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); hexI.blur(); } });
  on(hexI,'blur',paint);
  on(copy,'click',async function(){
    const v=hx(get())||'';
    try{ await navigator.clipboard.writeText(v); }
    catch(e){
      const t=document.createElement('textarea'); t.value=v;
      t.style.cssText='position:fixed;opacity:0'; document.body.appendChild(t);
      t.select(); try{ document.execCommand('copy'); }catch(_){}
      t.remove();
    }
    toast(v+' 복사됨');
  });

  paint();
  root._sync=paint;
  return root;
}

/* ------------------------------------------------------------
   toast / modal / busy
   ------------------------------------------------------------ */
/* Only ever one toast on screen. A second message replaces the first in place
   (with a small bump so a repeat still registers) rather than stacking under it. */
let toastEl=null, toastTimer=null;
function toast(msg,kind){
  const w=$('#toasts'); if(!w) return;
  clearTimeout(toastTimer);
  const html=ico(kind==='warn'?'warn':kind==='info'?'info':'check',16)+'<span>'+esc(msg)+'</span>';

  if(toastEl && toastEl.parentNode){
    toastEl.classList.remove('out');          /* cancels a dismissal already under way */
    toastEl.innerHTML=html;
    toastEl.classList.remove('bump');
    void toastEl.offsetWidth;                 /* restart the animation */
    toastEl.classList.add('bump');
  }else{
    w.innerHTML='';
    toastEl=el('div','toast');
    toastEl.innerHTML=html;
    w.appendChild(toastEl);
  }

  const t=toastEl;
  toastTimer=setTimeout(function(){
    t.classList.add('out');
    setTimeout(function(){

function pickImage(maxPx,cb){
  const f=document.createElement('input'); f.type='file'; f.accept='image/*';
  f.onchange=function(){
    const file=f.files&&f.files[0]; if(!file) return;
    const rd=new FileReader();
    rd.onload=function(){ shrink(rd.result,maxPx,cb); };
    rd.readAsDataURL(file);
  };
  f.click();
}
function shrink(dataUrl,maxPx,cb){
  const im=new Image();
  im.onload=function(){
    let w=im.naturalWidth,h=im.naturalHeight;
    const r=Math.min(1,maxPx/Math.max(w,h));
    w=Math.round(w*r); h=Math.round(h*r);
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(im,0,0,w,h);
    let out;
    try{ out=c.toDataURL('image/webp',0.86); if(out.indexOf('image/webp')<0) throw 0; }
    catch(e){ out=c.toDataURL('image/jpeg',0.88); }
    cb(out);
  };
  im.onerror=function(){ toast('이미지를 읽지 못했습니다','warn'); };
  im.src=dataUrl;
}
function downloadBlob(blob,name){
  const u=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
function downloadText(txt,name,mime){
  downloadBlob(new Blob([txt],{type:mime||'application/json'}),name);
}

   PAGINATION
   ============================================================ */
const HDR_PENALTY=22;   /* a group header re-drawn when a page starts mid-group */

/* measure every unit inside a hidden full-length render */
function measureUnits(build,ids){
  const host=el('div');
  host.style.cssText='position:fixed;left:-10000px;top:0;width:'+PV_W+'px;pointer-events:none;opacity:0;z-index:-1';
  const page=build();
  host.appendChild(page);
  document.body.appendChild(host);

  const body=$('.pv-body',page);
  const bRect=body.getBoundingClientRect();
  const tops=[];
  ids.forEach(function(id){
    const n=body.querySelector('[data-u="'+cssEsc(id)+'"]');
    tops.push(n ? (n.getBoundingClientRect().top-bRect.top) : (tops.length?tops[tops.length-1]:0));
  });
  if(tops.length) tops[0]=0;      /* page 1 owns the header area above the first unit */
  const total=body.scrollHeight;
  const chrome=page.getBoundingClientRect().height-bRect.height;
  host.remove();
  return {tops:tops, total:total, chrome:chrome};
}
function cssEsc(s){ return String(s).replace(/["\\]/g,'\\$&'); }

/* split indices into exactly n contiguous chunks, balanced by height */
function splitBalanced(tops,total,n){
  const N=tops.length;
  if(n<=1||N<=1) return [[0,N]];
  n=Math.min(n,N);
  const ext=tops.concat([total]);
  const span=(a,b)=>ext[b]-ext[a];
  let lo=0; for(let i=0;i<N;i++) lo=Math.max(lo,span(i,i+1));
  let hi=total, best=null;
  for(let it=0;it<40 && lo<=hi;it++){
    const mid=(lo+hi)/2;
    const cuts=pack(ext,N,mid);
    if(cuts.length<=n){ best=cuts; hi=mid-0.5; } else { lo=mid+0.5; }
  }
  let cuts=best||pack(ext,N,total/n);
  /* force exactly n chunks by bisecting the tallest ones */
  let guard=0;
  while(cuts.length<n && guard++<N){
    let bi=-1,bh=-1;
    for(let i=0;i<cuts.length;i++){
      const c=cuts[i]; if(c[1]-c[0]<2) continue;
      const h=span(c[0],c[1]); if(h>bh){bh=h;bi=i;}
    }
    if(bi<0) break;
    const c=cuts[bi], target=ext[c[0]]+span(c[0],c[1])/2;
    let k=c[0]+1;
    for(let j=c[0]+1;j<c[1];j++) if(Math.abs(ext[j]-target)<Math.abs(ext[k]-target)) k=j;
    cuts.splice(bi,1,[c[0],k],[k,c[1]]);
  }
  return cuts;
}
function pack(ext,N,maxH){
  const out=[]; let start=0;
  for(let i=1;i<=N;i++){
    if(ext[i]-ext[start]>maxH && i-1>start){ out.push([start,i-1]); start=i-1; }
  }
  out.push([start,N]);
  return out;
}

/* ============================================================
   PNG EXPORT  —  DOM -> inline styles -> SVG foreignObject -> canvas
   ============================================================ */
const PROPS=('display,position,top,right,bottom,left,width,height,min-width,min-height,max-width,max-height,'+
'margin-top,margin-right,margin-bottom,margin-left,padding-top,padding-right,padding-bottom,padding-left,'+
'box-sizing,border-top-width,border-right-width,border-bottom-width,border-left-width,'+
'border-top-style,border-right-style,border-bottom-style,border-left-style,'+
'border-top-color,border-right-color,border-bottom-color,border-left-color,'+
'border-top-left-radius,border-top-right-radius,border-bottom-right-radius,border-bottom-left-radius,'+
'background-color,background-image,background-size,background-position,background-repeat,background-clip,background-origin,'+
'color,font-family,font-size,font-weight,font-style,font-variant-numeric,line-height,letter-spacing,word-spacing,'+
'text-align,text-decoration-line,text-decoration-color,text-decoration-style,text-decoration-thickness,'+
'text-underline-offset,text-transform,text-overflow,text-indent,white-space,word-break,overflow-wrap,'+
'vertical-align,opacity,visibility,overflow-x,overflow-y,z-index,float,clear,'+
'flex-direction,flex-wrap,flex-grow,flex-shrink,flex-basis,align-items,align-self,align-content,justify-content,'+
'gap,row-gap,column-gap,grid-template-columns,grid-template-rows,place-items,'+
'transform,transform-origin,box-shadow,text-shadow,filter,object-fit,list-style-type,'+
'-webkit-text-fill-color,-webkit-text-stroke-color,-webkit-text-stroke-width').split(',');

/* Properties left out of PDEF are always written out. Margins and paddings MUST be:
   "not declared" would mean "whatever the browser's own stylesheet says", and the
   clone lands in a bare document where the app's reset (h1..h4,p,figure{margin:0};
   ul,ol{margin:0;padding:0}) does not exist. Skipping margin-top:0px on the memo
   heading handed it back the UA default h2{margin-block:0.83em} = 0.83x31 = 25.73px,
   which dropped the title onto the search bar and pushed the cards down with it. */
const PDEF={'background-image':'none','box-shadow':'none','text-shadow':'none','transform':'none','filter':'none',
'border-top-width':'0px','border-right-width':'0px','border-bottom-width':'0px','border-left-width':'0px',
'border-top-style':'none','border-right-style':'none','border-bottom-style':'none','border-left-style':'none',
'border-top-left-radius':'0px','border-top-right-radius':'0px','border-bottom-right-radius':'0px','border-bottom-left-radius':'0px',
'letter-spacing':'normal','word-spacing':'normal','white-space':'normal','text-indent':'0px',
'text-decoration-line':'none','text-transform':'none','opacity':'1','z-index':'auto','position':'static',
'overflow-x':'visible','overflow-y':'visible','float':'none','clear':'none','visibility':'visible',
'min-width':'0px','min-height':'0px','max-width':'none','max-height':'none','text-overflow':'clip',
'word-break':'normal','overflow-wrap':'normal','vertical-align':'baseline','object-fit':'fill',
'flex-direction':'row','flex-wrap':'nowrap','flex-grow':'0','flex-shrink':'1','flex-basis':'auto',
'align-items':'normal','align-self':'auto','align-content':'normal','justify-content':'normal',
'gap':'normal','row-gap':'normal','column-gap':'normal','grid-template-columns':'none','grid-template-rows':'none',
'place-items':'normal','list-style-type':'disc','font-variant-numeric':'normal',
'background-size':'auto','background-position':'0% 0%','background-repeat':'repeat',
'background-clip':'border-box','background-origin':'padding-box','text-decoration-style':'solid',
'text-decoration-thickness':'auto','text-underline-offset':'auto','font-style':'normal',
'-webkit-text-stroke-width':'0px','right':'auto','bottom':'auto','top':'auto','left':'auto'};

/* Does this element hold its own text, and all of it on one line?
   Anything with pre* white-space is excluded: there the line breaks ARE content. */
function oneLineText(s){
  let own=false;
  for(let n=s.firstChild;n;n=n.nextSibling)
    if(n.nodeType===3 && n.textContent.trim()){ own=true; break; }
  if(!own) return false;
  if(/^pre|break-spaces/.test(getComputedStyle(s).whiteSpace)) return false;
  const rg=document.createRange();
  rg.selectNodeContents(s);
  const rects=rg.getClientRects();
  let top=null;
  for(let i=0;i<rects.length;i++){
    const r=rects[i];
    if(!r.width && !r.height) continue;
    const t=Math.round(r.top);
    if(top===null) top=t; else if(t!==top) return false;
  }
  return top!==null;
}

function inlineTree(src,dst){
  const a=[src].concat($$('*',src));
  const b=[dst].concat($$('*',dst));
  for(let i=0;i<a.length;i++){
    const s=a[i], d=b[i];
    if(!d) break;
    if(s.ownerSVGElement) continue;                /* inside <svg>: attributes already carry paint */
    const cs=getComputedStyle(s);
    /* A text box is pinned to its getComputedStyle() width — which for a box that
       sizes to its own text IS that text's minimum width, so the slack is zero
       (measured: `검색` 27.73/27.73, the status clock -0.14px). The clone then
       re-lays the text out inside that frozen box, and half a pixel of difference
       in how the SVG document shapes the same font at the same size is enough to
       wrap it: `검색` came out as `검`/`색`, `10월 3일` as `10월 3`/`일`.
       So freeze the LINE, not the box — keep the text on one line and let the box
       size to it. Dropping `width` restores exactly the flex-basis:auto sizing the
       preview itself used, so where the two agree nothing moves at all. */
    const oneLine=oneLineText(s);
    let css='';
    for(let j=0;j<PROPS.length;j++){
      const p=PROPS[j];
      if(oneLine && (p==='width' || p==='white-space')) continue;
      /* Floor the height, don't freeze it. A pinned `height` stops a child's bottom
         margin from collapsing out of its parent, so the next sibling sits higher in
         the clone than in the preview (the memo list's rows lost their 3px gap). A
         min-height keeps the box from shrinking and lets it grow if this document
         needs one more line, instead of clipping it. */
      if(p==='height') continue;
      const v=cs.getPropertyValue(p);
      if(p==='min-height'){
        const hv=parseFloat(cs.height), mv=parseFloat(v);
        const use=Math.max(isFinite(hv)?hv:0, isFinite(mv)?mv:0);
        if(use>0) css+='min-height:'+use+'px;';
        continue;
      }
      if(v==='' ) continue;
      if(PDEF[p]!=null && v===PDEF[p]) continue;
      css+=p+':'+v+';';
    }
    if(oneLine) css+='white-space:nowrap;';
    d.setAttribute('style',css);
    d.removeAttribute('class');
    Array.prototype.slice.call(d.attributes).forEach(function(at){
      if(/^data-/.test(at.name)) d.removeAttribute(at.name);
    });
  }
}

/* Measure the LAYOUT box, never getBoundingClientRect(): #fitInner carries a
   transform:scale() to fit the stage, and that scale lands in the rect. Every
   descendant, meanwhile, is pinned to its getComputedStyle() width — which the
   transform does not touch. Handing the scaled width to the clone root makes the
   tree short by that much, flex-shrink pushes the shortfall into the tightest text
   boxes so they re-wrap, and .page{overflow:hidden} clips the right edge. */
function nodeToSvg(node){
  const r=node.getBoundingClientRect();
  const w=Math.max(1,Math.round(node.offsetWidth||r.width));
  const h=Math.max(1,Math.round(node.offsetHeight||r.height));
  const clone=node.cloneNode(true);
  inlineTree(node,clone);
  clone.style.margin='0'; clone.style.transform='none'; clone.style.boxShadow='none';
  clone.style.position='relative'; clone.style.left='0'; clone.style.top='0';
  clone.style.width=w+'px'; clone.style.minHeight=h+'px'; clone.style.height=h+'px';
  /* Inherited text properties the app sets on <body>/.pv but PROPS does not carry.
     Without them the SVG document shapes the same font differently — and, having no
     viewport of its own, Android Chrome is free to boost its font sizes. */
  clone.style.setProperty('-webkit-text-size-adjust','100%');
  clone.style.setProperty('text-size-adjust','100%');
  clone.style.setProperty('text-rendering','optimizeLegibility');
  clone.style.setProperty('-webkit-font-smoothing','antialiased');
  const xml=new XMLSerializer().serializeToString(clone);
  return {w:w,h:h,xml:xml};
}

function nodeToCanvas(node,scale){
  return new Promise(function(res,rej){
    const d=nodeToSvg(node);
    const sw=Math.round(d.w*scale), sh=Math.round(d.h*scale);
    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+sw+'" height="'+sh+'" '+
      'viewBox="0 0 '+d.w+' '+d.h+'"><foreignObject x="0" y="0" width="'+d.w+'" height="'+d.h+'">'+
      d.xml+'</foreignObject></svg>';
    const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    const im=new Image();
    im.decoding='sync';
    im.onload=function(){
      try{
        const c=document.createElement('canvas'); c.width=sw; c.height=sh;
        const x=c.getContext('2d');
        x.fillStyle='#FFFFFF'; x.fillRect(0,0,sw,sh);
        x.drawImage(im,0,0,sw,sh);
        res(c);
      }catch(e){ rej(e); }
    };
    im.onerror=function(){ rej(new Error('svg-render-failed')); };
    im.src=url;
  });
}
function canvasToBlob(c){
  return new Promise(function(res,rej){
    if(c.toBlob) c.toBlob(function(b){ b?res(b):rej(new Error('blob')); },'image/png');
    else{
      try{
        const s=c.toDataURL('image/png').split(',')[1];
        const bin=atob(s), arr=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
        res(new Blob([arr],{type:'image/png'}));
      }catch(e){ rej(e); }
    }
  });
}

function safeName(s){

function autoName(){

/* Browsers refuse repeated programmatic downloads, and in-app browsers (KakaoTalk,
   Instagram) refuse them outright. Keep the blobs around and offer real links the
   user can click — a click is a fresh gesture, and on phones it also allows
   long-press → save image. */
let DL_URLS=[];
function paintExportOut(files){
  const box=$('#exportOut'); if(!box) return;
  DL_URLS.forEach(function(u){ try{ URL.revokeObjectURL(u); }catch(e){} });
  DL_URLS=[];
  box.innerHTML='';
  if(!files || !files.length) return;

  const h=el('div','sec-t','만들어진 이미지'); h.style.margin='0 0 2px';
  box.appendChild(h);
  const note=el('p','hint');
  note.innerHTML='자동 저장이 막혔다면 아래를 눌러 직접 받으세요. 휴대폰에서는 <b>길게 눌러 이미지 저장</b>도 됩니다.';
  box.appendChild(note);

  const list=el('div','dl-list');
  files.forEach(function(f){
    const u=URL.createObjectURL(f.blob); DL_URLS.push(u);
    const a=document.createElement('a');
    a.className='dl-item'; a.href=u; a.download=f.name; a.target='_blank'; a.rel='noopener';
    const im=document.createElement('img'); im.src=u; im.alt=''; a.appendChild(im);
    a.appendChild(el('span','dl-n',f.name));
    a.appendChild(el('span','dl-s',Math.round(f.blob.size/1024)+'KB'));
    a.insertAdjacentHTML('beforeend', ico('download',16));
    list.appendChild(a);
  });
  box.appendChild(list);
}

async function exportPNG(){
  const pages=$$('.page',$('#deck'));
  if(!pages.length){ toast('내보낼 내용이 없습니다','warn'); return; }
  const scale=S.scale||2;
  const base=exportBase();
  const wasFlip=S.flip;
  if(wasFlip){ S.flip=false; renderAll(); await new Promise(r=>setTimeout(r,60)); }
  const live=$$('.page',$('#deck'));
  busy(true,'이미지를 만드는 중…');
  let okN=0;
  const made=[];
  try{
    for(let i=0;i<live.length;i++){
      busy(true,'이미지를 만드는 중… ('+(i+1)+'/'+live.length+')');
      const tag=$('.page-tag',live[i]); if(tag) tag.style.display='none';
      let c;
      try{ c=await nodeToCanvas(live[i],scale); }
      finally{ if(tag) tag.style.display=''; }
      const blob=await canvasToBlob(c);
      const label=live[i].dataset.label||'';
      const nm = live.length>1
        ? base+'_'+(i+1)+'of'+live.length+(label?'_'+safeName(label):'')+'.png'
        : base+'.png';
      made.push({name:nm, blob:blob});
      downloadBlob(blob,nm);
      okN++;
      await new Promise(r=>setTimeout(r,380));
    }
    paintExportOut(made);
    toast(okN>1 ? (okN+'장을 만들었습니다 — 저장이 안 됐으면 아래 목록에서 받으세요')
                : '이미지를 저장했습니다');
  }catch(e){
    console.error(e);
    if(made.length) paintExportOut(made);
    toast('이미지 변환에 실패했습니다. 브라우저를 최신 버전으로 업데이트해 주세요.','warn');
  }finally{
    busy(false);
    if(wasFlip){ S.flip=true; renderAll(); }
  }
}

/* every exported page must come out the same height: measure, then pad them all up */
function equalizePages(deck){
  const pvs=$$('.page > .pv',deck);
  if(pvs.length<2) return;
  let mx=0;
  pvs.forEach(function(p){ p.style.minHeight=''; });
  pvs.forEach(function(p){ mx=Math.max(mx,p.offsetHeight); });
  pvs.forEach(function(p){ p.style.minHeight=mx+'px'; });
}

function buildDeck(){
  const deck=$('#deck');
  deck.innerHTML='';
  const items=liveList();

  if(!items.length){ deck.appendChild(emptyState()); return 0; }

  if(S.mode==='chat'){
    /* one page per detected room */
    if(S.chat.roomMode==='split' && S.chat.rooms.length>1){
      liveRooms().forEach(function(ri){
        const sub=items.filter(u=>u.room===ri);
        if(!sub.length) return;
        deck.appendChild(pageWrap(
          renderChatPage(sub,{dateLine:true, room:ri, title:roomPartner(ri)}),
          roomPartner(ri).slice(0,18), roomPartner(ri).slice(0,14)));
      });
      equalizePages(deck);
      return $$('.page',deck).length;
    }

    /* cut on sender cells — never inside one person's run of bubbles */
    const cells=chatCells(items);
    const n=clamp(S.pages.chat,1,cells.length);
    if(n<=1){
      deck.appendChild(pageWrap(renderChatPage(items,{dateLine:true}),'',''));
    }else{
      const m=measureUnits(()=>renderChatPage(items,{dateLine:true}), cells.map(c=>c.id));
      const cuts=splitBalanced(m.tops,m.total,n);
      cuts.forEach(function(c,i){
        const a=cells[c[0]].a, b=cells[c[1]-1].b;
        deck.appendChild(pageWrap(
          renderChatPage(items.slice(a,b),{dateLine:i===0}),'',
          (i+1)+' / '+cuts.length));
      });
      equalizePages(deck);
    }
    return $$('.page',deck).length;
  }

  /* ---------------- memo ---------------- */
  if(S.memo.open>=0){
    const note=items[S.memo.open]||items[0];
    if(note) addMemoDetailPages(deck,note,clamp(S.pages.memo,1,40));
    return $$('.page',deck).length;
  }
  const what=S.memo.exportWhat;
  const picked=items.filter(n=>S.memo.sel.indexOf(n.id)>=0);

  if(what==='home'||what==='both'||!picked.length){
    const n=(what==='both')?1:clamp(S.pages.memo,1,items.length);
    if(n<=1){
      deck.appendChild(pageWrap(renderMemoHome(items,{}),'홈',''));
    }else{
      const ids=items.map(x=>x.id);
      const m=measureUnits(()=>renderMemoHome(items,{}),ids);
      const cuts=splitBalanced(m.tops,m.total,n);
      const ext=m.tops.concat([m.total]);
      cuts.forEach(function(c,i){
        deck.appendChild(pageWrap(renderMemoHome(items.slice(c[0],c[1]),{}),'홈',(i+1)+' / '+cuts.length));
      });
      equalizePages(deck);
    }
  }
  if((what==='detail'||what==='both') && picked.length){
    if(picked.length===1 && what==='detail'){
      addMemoDetailPages(deck,picked[0],clamp(S.pages.memo,1,40));
    }else{
      picked.forEach(function(n){ deck.appendChild(pageWrap(renderMemoDetail(n,null,{}),plain(n.title).slice(0,18),plain(n.title).slice(0,14))); });
      equalizePages(deck);
    }
  }
  return $$('.page',deck).length;
}

function addMemoDetailPages(deck,note,n){
  const bl=memoBlocks(note.body);
  const label=plain(note.title).slice(0,18);
  if(n<=1||bl.length<=1){
    deck.appendChild(pageWrap(renderMemoDetail(note,null,{}),label,''));
    return;
  }
  /* split body text by line count, balanced */
  const lines=String(note.body).split('\n');
  const per=Math.ceil(lines.length/n);
  const chunks=[];
  for(let i=0;i<lines.length;i+=per) chunks.push(lines.slice(i,i+per).join('\n'));
  while(chunks.length<n && chunks.length) chunks.push('');
  chunks.slice(0,n).forEach(function(c,i){
    deck.appendChild(pageWrap(renderMemoDetail(note,c,{head:i===0}),label,(i+1)+' / '+Math.min(n,chunks.length)));
  });
  equalizePages(deck);
}

/* ---------- scale the deck to fit ---------- */
function innerBox(n){
  const cs=getComputedStyle(n);
  return {
    w: n.clientWidth - parseFloat(cs.paddingLeft||0) - parseFloat(cs.paddingRight||0),
    h: n.clientHeight - parseFloat(cs.paddingTop||0) - parseFloat(cs.paddingBottom||0)
  };
}
function layoutDeck(animate){
  const area=$('#stageArea'), fo=$('#fitOuter'), fi=$('#fitInner'), deck=$('#deck');
  const pages=$$('.page',deck);
  const isFlip=S.flip&&pages.length>1;
  area.classList.toggle('is-flip',isFlip);
  deck.classList.toggle('is-flip',isFlip);

  if(!pages.length){
    fi.style.position='static'; fi.style.transform='none'; fi.style.width='auto';
    fo.style.width=''; fo.style.height=''; area.style.minHeight=''; return;
  }
  fi.style.position='absolute';

  const bx=innerBox(area);
  const aw=Math.max(150,bx.w), ah=Math.max(180,bx.h);
  let ph=0; pages.forEach(p=>{ ph=Math.max(ph,p.offsetHeight||0); });
  if(!ph) ph=700;

  if(isFlip){
    /* Every page is position:absolute in flip mode, so the deck carries no intrinsic
       height. Wherever the stage row is sized to its content — the stacked phone
       layout — that collapses the stage to its own padding, which then feeds back
       into the scale and clips the stack at both ends. So take the budget from the
       CSS cap rather than from the box we are about to size, and afterwards hold the
       stage open at exactly what the stack needs. */
    const acs=getComputedStyle(area);
    const padY=(parseFloat(acs.paddingTop)||0)+(parseFloat(acs.paddingBottom)||0);
    const cap=parseFloat(acs.maxHeight);
    const budget=isFinite(cap)?Math.max(160,cap-padY):ah;
    const s=clamp(Math.min(1,(aw-90)/PV_W,(budget-24)/ph),0.2,1);
    area.style.minHeight=Math.ceil(ph*s+24+padY)+'px';
    /* drop any leftover strip sizing so the stack centres on the stage */
    fi.style.transform='none'; fi.style.width=''; fi.style.height='';
    fo.style.width=''; fo.style.height='';
    /* a freshly built deck must land in place, not animate in from nowhere */
    if(!animate) pages.forEach(p=>{ p.style.transition='none'; });
    pages.forEach(function(p,i){
      const rel=i-S.flipIdx;
      p.dataset.rel=String(clamp(rel,-3,3));
      p.dataset.far=Math.abs(rel)>2?'1':'0';
      const off=rel*Math.min(158,PV_W*0.44)*s;
      const sc=s*(rel===0?1:Math.abs(rel)===1?0.87:0.76);
      const rot=rel===0?0:(rel<0?20:-20);
      p.style.width=PV_W+'px';
      p.style.transform='translate(-50%,-50%) translateX('+off+'px) scale('+sc+') rotateY('+rot+'deg)';
    });
    if(!animate){
      void deck.offsetWidth;                       /* flush, then hand control back to CSS */
      pages.forEach(p=>{ p.style.transition=''; });
    }
    return;
  }

  area.style.minHeight='';          /* only flip mode needs the stage propped open */
  pages.forEach(p=>{ p.style.transition=''; p.style.transform=''; p.removeAttribute('data-rel'); p.removeAttribute('data-far'); });
  const n=pages.length;
  /* Fit at most 2 boards, and only if they stay readable. Anything more scrolls
     sideways rather than shrinking every page into uselessness. */
  let show=1;
  for(let k=Math.min(n,2);k>=1;k--){
    if(aw/(k*PV_W+(k-1)*GAP) >= 0.70){ show=k; break; }
  }
  const s=clamp(Math.min(1, aw/(show*PV_W+(show-1)*GAP)), 0.5, 1);
  const dw=n*PV_W+(n-1)*GAP;
  fi.style.width=dw+'px';
  fi.style.transform='scale('+s+')';
  fo.style.width=(dw*s)+'px';
  fo.style.height=(ph*s+4)+'px';
}

  if(renderLock) return;

function reparse(keepEdits){
  const raw=curRaw();
  if(S.mode==='chat'){
    const r=parseChat(raw);
    if(keepEdits && S.chat.units.length===r.units.length){
      r.units.forEach(function(u,i){ const o=S.chat.units[i]; if(o){ u.on=o.on; u.text=o.text; } });
    }
    S.chat.units=r.units; S.chat.rooms=r.rooms;
    if(!S.chat.me || participants().indexOf(S.chat.me)<0) S.chat.me=r.me;
    S.chat.room=clamp(S.chat.room,0,Math.max(0,r.rooms.length-1));
  }else{
    const old={}; S.memo.notes.forEach(n=>{ old[n.when+'|'+n.tag]=n; });
    const ns=parseMemo(raw);
    if(keepEdits) ns.forEach(function(n){ const o=old[n.when+'|'+n.tag]; if(o){ n.on=o.on; n.title=o.title; n.body=o.body; n.sub=o.sub; } });
    S.memo.notes=ns;
    S.memo.sel=S.memo.sel.filter(id=>ns.some(n=>n.id===id));
    S.memo.open=-1;
  }
  const b=baseList().length;
  S.range[S.mode]=[1,Math.max(1,b)];
  S.pages[S.mode]=clamp(S.pages[S.mode],1,Math.max(1,b));
  S.flipIdx=0;
  afterDataChange(true);
}

  renderAll();
}

function srcArray(){ return S.mode==='chat' ? S.chat.units : S.memo.notes; }
function srcIndex(u){ const a=srcArray(); for(let i=0;i<a.length;i++) if(a[i]===u) return i; return -1; }

function dupItem(i){
  const list=baseList(), u=list[i], a=srcArray(), k=srcIndex(u);
  if(k<0) return;
  const c=deep(u); c.id=(S.mode==='chat'?'c':'m')+'dup_'+uid();
  a.splice(k+1,0,c);
  structuralChange();
}
function delItem(i){
  const list=baseList(), u=list[i], a=srcArray(), k=srcIndex(u);
  if(k<0) return;
  a.splice(k,1);
  if(S.mode==='memo') S.memo.sel=S.memo.sel.filter(x=>x!==u.id);
  if(editingId===u.id) editingId=null;
  structuralChange();
}
function moveItem(i,d){
  const list=baseList(), u=list[i], a=srcArray(), k=srcIndex(u);
  const t=k+d;
  if(k<0||t<0||t>=a.length) return;
  a.splice(t,0,a.splice(k,1)[0]);
  structuralChange();
}
function structuralChange(){
  const b=baseList().length||1;
  const r=curRange();
  r[0]=clamp(r[0],1,b); r[1]=clamp(r[1],r[0],b);
  if(S.memo.open>=b) S.memo.open=-1;
  paintRangeUI(); paintEditList(); clampPages(); paintMemoSelInfo(); renderAll();
}
